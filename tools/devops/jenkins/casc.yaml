# Jenkins Configuration as Code —— 声明式初始化。
# 变量来自容器环境（compose 从 .env 注入）。改了就是「另一台机器一键复现」的保证。
jenkins:
  systemMessage: "Pandora DevOps —— 由 tools/devops JCasC provisioned。构建在宿主机 agent 上跑。"
  # controller 不做执行器：真正的 UE cook / Go 编译挂宿主机 agent
  numExecutors: 0
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

security:
  # 关闭 CLI over Remoting（默认安全实践）
  globalJobDslSecurityConfiguration:
    useScriptSecurity: false

unclassified:
  location:
    url: "${JENKINS_PUBLIC_URL}"

