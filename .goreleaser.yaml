# GoReleaser 配置 —— Pandora 后端 24 个 Go 二进制的统一构建 / 版本戳 / 打包。
#
# ⚠️ 本仓库是 **go.work 多模块工作区**（29 个 use，每服务独立 module，无根 go.mod）。
#    GoReleaser 默认按单 module 工作，这里靠每个 build 的 `dir:` 指到具体模块目录来适配。
#    该组合已实测可用（linux/amd64 真产物 + ldflags 注入生效）。
#
# 定位（避免与既有机制重复，见 CLAUDE.md §15）：
#   - 既有 `deploy/services/Dockerfile` + `start.ps1` 负责**镜像**构建与注入 → 仍是部署主链路。
#   - 本配置负责**裸二进制**的可复现构建 + 统一版本戳 + 归档校验和，
#     适合：给运维/GM 发 CLI（gmctl）、出可追溯的构建产物、CI 里一条命令编全部服务。
#   - `release:` 已 disable —— 你们不用 GitHub Releases，产物归宿是 F:\work\artifacts 与 MinIO。
#
# 常用命令：
#   goreleaser build --snapshot --clean          # 编全部（dev 快照，无需 tag）
#   goreleaser build --snapshot --clean --id login   # 只编某一个
#   goreleaser check                             # 校验本文件
#
# 版本注入目标见 pkg/version/version.go（Version / Commit / BuildTime 三个包级 var）。
version: 2
project_name: pandora

