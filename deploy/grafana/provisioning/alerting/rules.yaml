# Grafana 统一告警 —— 告警规则(2026-07-10)
#
# 首批规则消费 ds_allocator 容量巡检暴露的指标(pandora_ds_allocator_fleet_*,
# 见 services/battle/ds_allocator/internal/biz/capacity.go)。数据源 uid=pandora-prometheus
# (deploy/grafana/provisioning/datasources/datasources.yml)。
#
# 新增告警照此追加:一条规则 = 一个 Prometheus 查询(refId A)+ 一个阈值表达式(refId C)。
# label severity 决定路由(notification-policies.yaml);annotations 决定通知文案(templates.yaml)。
apiVersion: 1

groups:
  - orgId: 1
    name: ds-capacity
    folder: Pandora Alerts
    interval: 1m
    rules:
      # ── 战斗 DS 并发接近容量上限(warning)──────────────────────────────────
      # allocated/replicas ≥ 0.8 持续 5m → 提醒调大 FleetAutoscaler maxReplicas
      # (deploy/k8s/agones/25-fleetautoscaler-battle.yaml;日常伸缩已由 autoscaler 自动做)。
      - uid: pandora-ds-fleet-near-limit
        title: 战斗DS并发接近容量上限
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: warning
          service: ds_allocator
        annotations:
          summary: '战斗 DS Fleet {{ $labels.fleet }} 并发占用 ≥80%,接近容量上限'
          description: '考虑调大 FleetAutoscaler maxReplicas(25-fleetautoscaler-battle.yaml);当前占用比 {{ with $values.A }}{{ humanizePercentage .Value }}{{ else }}无数据{{ end }}'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: max by (fleet) (pandora_ds_allocator_fleet_usage_ratio)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator: { type: gt, params: [0, 0] }
                  operator: { type: and }
                  query: { params: [C] }
                  reducer: { type: last, params: [] }
                  type: query
              datasource: { type: __expr__, uid: __expr__ }
              expression: $A >= 0.8
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: math

      # ── 战斗 DS 容量打满 / 无空闲(critical)────────────────────────────────
      # ready==0 持续 2m → 新对局分配必失败(玩家匹配成功进不去),立即扩容。
      - uid: pandora-ds-fleet-exhausted
        title: 战斗DS容量打满无空闲
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        isPaused: false
        labels:
          severity: critical
          service: ds_allocator
        annotations:
          summary: '战斗 DS Fleet {{ $labels.fleet }} 无空闲副本(ready=0),新对局分配将失败'
          description: '已触顶 FleetAutoscaler maxReplicas(25-fleetautoscaler-battle.yaml),立即调大;玩家匹配成功但可能进不了战斗。INC-20260724-001 降噪:desired(spec.replicas)==0 的 Fleet 被排除——未做金丝雀发布时 canary 常态 0 副本,旧规则让它长期 firing 淹没了 stable 的真实告警。用 unless 而非 and:若 allocator 未上报 desired 序列(旧版本/回滚),规则退化为原判据继续告警,不会被静默。多副本滚动期只要任一副本上报 desired==0 即排除该 fleet 全部序列。'
        data:
          - refId: A
            relativeTimeRange: { from: 120, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: max by (fleet) (pandora_ds_allocator_fleet_ready) unless on (fleet) (max by (fleet) (pandora_ds_allocator_fleet_desired_replicas) == 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # ── ds_allocator 实例不可达 / metrics 采集中断(critical)──────────────
      # 上面两条容量规则 noDataState=OK(Fleet 未部署时指标本就不存在,不该误报);
      # 但这样一来 exporter 挂掉 / 抓取中断时 ready=0 critical 也会被 NoData 静默成 OK,
      # 形成"最该告警时反而不响"的盲区(三审 P1-8)。这条可用性规则补齐该盲区:
      # up{service=ds_allocator}==0(目标配置在案但抓不到)或整条 up 序列消失(NoData→Alerting)
      # 持续 2m 即告警。目标在 prometheus.yml 静态登记,稳态下 up 必存在,不会误报。
      - uid: pandora-ds-allocator-down
        title: DS调度实例不可达
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          service: ds_allocator
        annotations:
          summary: 'ds_allocator 实例不可达或 metrics 抓取中断,容量告警已失效'
          description: '容量规则依赖 ds_allocator 暴露的 fleet 指标;实例挂掉时这些规则会被 NoData 静默。请立即检查 ds_allocator 进程与 51020 端口。'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: max (up{job="pandora-go-services", service="ds_allocator"})
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C

      # ── Hub 归属/容量账本长期无写者(critical)──────────────────────────────
      # R11 复审 P0-2:hub_allocator 是 assignment/容量账本的单写者,写权由 etcd 继任
      # 租约授予(pkg/dsauthfence/writerlease)。此前"长期无主"只能人工逐 Pod 直连健康
      # 页发现——尤其竞选或激活钩子**永久阻塞**(而非返回错误)时,失败计数器一次都不
      # 会动,degraded 恒 false,日志也不再输出,完全静默。
      #
      # 判据取全局而非单副本:失主副本是**有意的热备**(拒写但可秒级接管),单副本
      # held=0 属正常。真正的故障是**没有任何副本上报 held=1**——同时覆盖竞选阻塞、
      # 激活阻塞、全体竞选失败三种形态,不依赖"某个函数返回了错误"这个前提。
      #
      # for: 1m > lease TTL 兜底接任窗口(15s)+ 滚动让位(亚秒),正常发布不误报。
      # noDataState/execErrState=Alerting:指标序列消失(进程全挂/抓取中断)同样是
      # "无法证明有写者",必须响,不能被 NoData 静默成 OK(同上条 ds_allocator 教训)。
      # 未启用继任租约时(legacy/off,单写由部署策略保证)enabled=0,用 unless 排除,
      # 避免 dev/单副本 Recreate 部署常态 firing。
      - uid: pandora-hub-allocator-no-writer
        title: Hub账本长期无写者
        condition: C
        for: 1m
        noDataState: Alerting
        execErrState: Alerting
        isPaused: false
        labels:
          severity: critical
          service: hub_allocator
        annotations:
          summary: 'hub_allocator 无任何副本持有写者租约,Hub 归属/容量写入全部被拒'
          description: '玩家 AssignHub / Transfer / Admission 将持续失败(可重试错误)。检查 etcd 可达性与选举 key /pandora/writerlease/hub_allocator/writer;逐 Pod 看 pandora_hub_allocator_writer_campaign_errors 与 _activation_errors 区分"选不上"与"选上了激活不过"。激活连续失败 = 继任者 fence 水位推扫未完成,此时拒写是正确的 fail-closed,但必须尽快恢复。'
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: pandora-prometheus
            model:
              editorMode: code
              expr: sum (pandora_hub_allocator_writer_held) unless (max (pandora_hub_allocator_writer_lease_enabled) == 0)
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            relativeTimeRange: { from: 0, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: lt, params: [1] }
              refId: C
