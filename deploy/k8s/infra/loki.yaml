# Pandora 日志采集(k8s dev-grade,minikube 用)— Loki + Alloy
#
# 与 infra.yaml 同级别的开发配置:单副本、emptyDir(Pod 重建丢日志)、无鉴权。
# 由 tools/scripts/start.ps1 -Mode k8s 自动 apply(infra 之后)。
#
# 采集范围:除 kube-system / kube-public / kube-node-lease 外全部 Pod stdout
# (业务 20 服务 + Agones GameServer DS 的 UE log 都能进 Loki)。
#
# 宿主查看(Grafana 数据源 "Loki (k8s)" 已在 compose Grafana 预配):
#   kubectl -n pandora port-forward svc/loki 3101:3100
#   浏览器 http://localhost:3001 → Explore → Loki (k8s)
---
# ── Loki 配置 ──────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata: { name: loki-config, namespace: pandora }
data:
  loki.yml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      instance_addr: 127.0.0.1
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

        # ── 以后切 MinIO/S3 时在这里**追加新周期**(不要改上面那条)──────────────
        # Loki 跨 schema 边界透明合并查询:旧周期仍从 filesystem 读,新周期写 s3,
        # 切换之后历史日志照样查得到。from 必须是**未来**的 UTC 日期(YYYY-MM-DD)。
        # - from: "2026-09-01"
        #   store: tsdb
        #   object_store: s3
        #   schema: v13
        #   index:
        #     prefix: index_
        #     period: 24h

    # ── MinIO/S3 后端(与上面新周期配套;现在不生效)──────────────────────────────
    # 凭据经 k8s Secret 注入容器环境 + Loki 加 -config.expand-env=true,勿写进本文件。
    # ⚠️ 桶上不要再挂 MinIO ILM 过期规则:保留期由 compactor 的 retention_period 统一管,
    #    两套并存会让 MinIO 删掉索引仍引用的 chunk,查询报错。
    # storage_config:
    #   filesystem:
    #     directory: /loki/chunks
    #   aws:
    #     endpoint: minio.pandora.svc:9000
    #     bucketnames: pandora-logs
    #     access_key_id: ${MINIO_ROOT_USER}
    #     secret_access_key: ${MINIO_ROOT_PASSWORD}
    #     s3forcepathstyle: true
    #     insecure: true
    #     region: null
    limits_config:
      retention_period: 168h
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 16
      ingestion_burst_size_mb: 32
    compactor:
      working_directory: /loki/compactor
      retention_enabled: true
      delete_request_store: filesystem
---
# 日志数据盘。原为 emptyDir —— Loki Pod 一重建(滚更/驱逐/节点漂移)历史日志全部归零,
# 与 retention_period=168h 无关,是「事后查不到那局 DS 日志」的首要现实原因。
# dev 用 minikube 默认 hostpath StorageClass 落本机盘即可;生产改对象存储见 infra.md §11.2。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: pandora
  labels: { app: loki }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: loki, namespace: pandora, labels: { app: loki } }
spec:
  replicas: 1
  # 单副本 + RWO 数据盘不得 RollingUpdate：新旧 Pod 会抢同一个 PVC,新 Pod 卡 Pending。
  # 与 etcd 同一纪律(infra.yaml)。
  strategy: { type: Recreate }
  # 新机器首次冷拉 Grafana 日志栈时允许 30 分钟；日志栈仍是非关键路径，不阻断业务启动。
  progressDeadlineSeconds: 1800
  selector: { matchLabels: { app: loki } }
  template:
    metadata: { labels: { app: loki } }
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.4.1
          args: ["-config.file=/etc/loki/loki.yml"]
          ports: [ { containerPort: 3100 } ]
          volumeMounts:
            - { name: config, mountPath: /etc/loki, readOnly: true }
            - { name: data, mountPath: /loki }
          readinessProbe:
            httpGet: { path: /ready, port: 3100 }
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: config
          configMap: { name: loki-config }
        - name: data
          persistentVolumeClaim: { claimName: loki-data }
---
apiVersion: v1
kind: Service
metadata: { name: loki, namespace: pandora }
spec:
  selector: { app: loki }
  ports:
    - { name: http, port: 3100, targetPort: 3100 }
---
# ── Alloy(采集端,经 kubelet API tail 全集群 Pod 日志)────────────────────────
apiVersion: v1
kind: ServiceAccount
metadata: { name: alloy, namespace: pandora }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: pandora-alloy-logs }
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "namespaces", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["nodes/proxy"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: pandora-alloy-logs }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pandora-alloy-logs
subjects:
  - { kind: ServiceAccount, name: alloy, namespace: pandora }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: alloy-config, namespace: pandora }
data:
  config.alloy: |
    // 发现全集群 Pod,排除系统 namespace
    discovery.kubernetes "pods" {
      role = "pod"
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        regex         = "kube-system|kube-public|kube-node-lease"
        action        = "drop"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        target_label  = "namespace"
      }

      // 业务 Deployment 都有 app label;GameServer Pod 无 app 时 service 留空,靠 pod label 查
      rule {
        source_labels = ["__meta_kubernetes_pod_label_app"]
        target_label  = "service"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        target_label  = "pod"
      }

      rule {
        target_label = "source"
        replacement  = "k8s"
      }
    }

    // 经 kubelet API tail Pod 日志(不挂 hostPath,minikube 单节点 Deployment 即可)
    loki.source.kubernetes "pods" {
      targets    = discovery.relabel.pods.output
      forward_to = [loki.process.extract_level.receiver]
    }

    // zap JSON 日志提取 level 进 label;非 JSON 行原样透传
    loki.process "extract_level" {
      forward_to = [loki.write.local.receiver]

      stage.json {
        expressions = { level = "level" }
      }

      stage.labels {
        values = { level = "" }
      }
    }

    loki.write "local" {
      endpoint {
        url = "http://loki.pandora.svc:3100/loki/api/v1/push"
      }
    }
---
# 采集进度(positions)盘。原为 emptyDir —— Alloy 重启即忘记读到哪。
# 对长驻业务 Pod 只是重复/漏采一小段;但对 **Battle DS 这种每局一换的短命 Pod**,
# 重启期间被回收掉的那一局,Pod 与 kubelet 日志目录都已消失,没有第二份可回补 = 永久丢失。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alloy-data
  namespace: pandora
  labels: { app: alloy }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alloy, namespace: pandora, labels: { app: alloy } }
spec:
  replicas: 1
  # 单副本 + RWO 数据盘不得 RollingUpdate(同 Loki/etcd 纪律)。
  strategy: { type: Recreate }
  # 与 Loki 对齐，避免共享下载带宽时被 Deployment 默认 600s 提前判失败。
  progressDeadlineSeconds: 1800
  selector: { matchLabels: { app: alloy } }
  template:
    metadata: { labels: { app: alloy } }
    spec:
      serviceAccountName: alloy
      containers:
        - name: alloy
          image: grafana/alloy:v1.7.1
          args:
            - run
            - /etc/alloy/config.alloy
            - --storage.path=/var/lib/alloy/data
          ports: [ { containerPort: 12345 } ]
          volumeMounts:
            - { name: config, mountPath: /etc/alloy, readOnly: true }
            - { name: data, mountPath: /var/lib/alloy/data }
      volumes:
        - name: config
          configMap: { name: alloy-config }
        - name: data
          persistentVolumeClaim: { claimName: alloy-data }
