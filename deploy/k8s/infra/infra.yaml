# Pandora 基础设施(k8s dev-grade,单副本,minikube/本地集群用)
#
# ⚠️ 这是「能把链路跑起来」的开发级基础设施,不是生产配置:
#   - 单副本、大多数状态仍是开发级临时存储、明文口令、Kafka 单 broker。
#   - 例外：etcd 承载 DS auth required_writer_epoch，必须用 PVC 持久化；否则 Pod 重建
#     会让所有 enforce writer/DS fail-closed，且禁止把 missing 默认成 1。
#   - 生产请用各自的 Operator / StatefulSet / 外部托管实例,并改 online overlay。
#
# 由 tools/scripts/start.ps1 -Mode k8s 自动 apply。MySQL 建库脚本通过
# configmap pandora-mysql-init 注入(launcher 用 deploy/mysql-init 现场生成)。
#
# 服务名(同 namespace 内短名解析):mysql / redis / zookeeper / kafka / etcd
# —— 与 docker-compose 一致,所以 run/cluster/etc 配置两边通用。
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mysql, namespace: pandora, labels: { app: mysql } }
spec:
  replicas: 1
  # 首次在 minikube 内冷拉 mysql:8.4(~812MB)可达 10 分钟+;Deployment 默认
  # progressDeadlineSeconds=600s 会在拉镜像期间就把 rollout 判失败(ProgressDeadlineExceeded),
  # 令 kubectl rollout status 报错。放宽到 30 分钟覆盖首次冷拉,缓存后不影响。
  progressDeadlineSeconds: 1800
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          args:
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_0900_ai_ci
            - --max_connections=500
            # ⚠️ 以下两项**放宽持久化,仅限本地开发**。生产绝不可照搬(线上也用不到本文件:
            # overlays/online/kustomization.yaml 只引用 ../../services,不含 infra/)。
            #
            # 为什么要放宽:默认的 trx_commit=1 + sync_binlog=1 意味着**每次事务提交做两次 fsync**,
            # 而本地数据目录是 emptyDir → minikube 容器层 → Docker Desktop 虚拟磁盘,这条链上的
            # fsync 在 Windows 上慢到 0.7~4.5 秒。实测 owner 服务续租的分段计时:
            #     total=1681ms  commit=1680ms  begin_tx=0  select=0  pool_wait=0
            # 即延迟 100% 在 commit,与连接池、查询、锁全无关系。
            #
            # 后果不只是"慢":owner 提交卡住 → hub-allocator 调 QueryOwner 超时 → 准入 fail-closed
            # → 玩家被踢 → 重连清掉社交缓存 → 队友血条颜色解析不出来。一条 fsync 抖动能把
            # 整条进场链打断。
            #
            # trx_commit=2:提交只写 OS 缓存,由后台每秒 fsync。进程崩溃不丢数据,整机断电最多丢 1 秒。
            # sync_binlog=0:binlog 落盘交给 OS。本地无从库、无 PITR 需求。
            - --innodb-flush-log-at-trx-commit=2
            - --sync-binlog=0
          env:
            - { name: MYSQL_ROOT_PASSWORD, value: pandora_dev_root }
            - { name: MYSQL_USER, value: pandora }
            - { name: MYSQL_PASSWORD, value: pandora_dev_pwd }
          ports: [ { containerPort: 3306 } ]
          volumeMounts:
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
            - { name: data, mountPath: /var/lib/mysql }
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -ppandora_dev_root"] }
            initialDelaySeconds: 20
            periodSeconds: 10
      volumes:
        - name: init
          configMap: { name: pandora-mysql-init, optional: true }
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: mysql, namespace: pandora }
spec:
  selector: { app: mysql }
  ports: [ { port: 3306, targetPort: 3306 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: redis, namespace: pandora, labels: { app: redis } }
spec:
  replicas: 1
  # 虽然 alpine 镜像较小，但会与 MySQL/Kafka/ZooKeeper 同时冷拉；统一放宽 Deployment
  # deadline，避免共享下载队列较慢时被默认 600s 提前判失败。
  progressDeadlineSeconds: 1800
  selector: { matchLabels: { app: redis } }
  template:
    metadata: { labels: { app: redis } }
    spec:
      containers:
        - name: redis
          image: redis:8.8.0-alpine
          # noeviction(R4 复审 P1-5):权威态(会话/push 缓冲/租约)不容 LRU 静默驱逐;push 启动门强制核验。
          args: ["redis-server", "--appendonly", "yes", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
          ports: [ { containerPort: 6379 } ]
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: redis, namespace: pandora }
spec:
  selector: { app: redis }
  ports: [ { port: 6379, targetPort: 6379 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: zookeeper, namespace: pandora, labels: { app: zookeeper } }
spec:
  replicas: 1
  # confluent cp-zookeeper 镜像 ~1GB,首次冷拉常超默认 600s progress deadline。放宽到 30 分钟。
  progressDeadlineSeconds: 1800
  selector: { matchLabels: { app: zookeeper } }
  template:
    metadata: { labels: { app: zookeeper } }
    spec:
      # 关闭 k8s 注入的 Docker-link 式服务环境变量(ZOOKEEPER_PORT=tcp://ip:2181 等)。
      # confluent cp 镜像会把 ZOOKEEPER_* 当作配置覆盖,被注入的 URL 值会污染 zookeeper.properties。
      enableServiceLinks: false
      containers:
        - name: zookeeper
          image: confluentinc/cp-zookeeper:7.9.7
          env:
            - { name: ZOOKEEPER_CLIENT_PORT, value: "2181" }
            - { name: ZOOKEEPER_TICK_TIME, value: "2000" }
          ports: [ { containerPort: 2181 } ]
          readinessProbe:
            tcpSocket: { port: 2181 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata: { name: zookeeper, namespace: pandora }
spec:
  selector: { app: zookeeper }
  ports: [ { port: 2181, targetPort: 2181 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: kafka, namespace: pandora, labels: { app: kafka } }
spec:
  replicas: 1
  # 单 broker(BROKER_ID=1):更新时必须先停旧 Pod 再起新 Pod。默认 RollingUpdate 会让新旧
  # 同时在跑,新 Pod 注册 ZK /brokers/ids/1 时被旧 Pod 占住 -> NodeExistsException -> CrashLoop。
  strategy: { type: Recreate }
  # confluent cp-kafka 镜像 ~1GB,首次冷拉常超默认 600s progress deadline。放宽到 30 分钟。
  progressDeadlineSeconds: 1800
  selector: { matchLabels: { app: kafka } }
  template:
    metadata: { labels: { app: kafka } }
    spec:
      # ⚠️ 关键:关闭 k8s 注入的 Docker-link 式服务环境变量。
      #   因为本 namespace 里有名为 kafka 的 Service,k8s 默认会给 kafka Pod 注入
      #   KAFKA_PORT=tcp://<clusterIP>:9092 等变量;confluent cp-kafka 入口脚本把所有
      #   KAFKA_* 当成配置覆盖 -> 把 KAFKA_PORT 解析成已废弃的 `port` 属性且值是个 URL,
      #   于是报 "port is deprecated..." 并 exit 1(CrashLoopBackOff)。关掉链接变量即可。
      enableServiceLinks: false
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:7.9.7
          env:
            - { name: KAFKA_BROKER_ID, value: "1" }
            - { name: KAFKA_ZOOKEEPER_CONNECT, value: "zookeeper:2181" }
            # advertise 本 Pod IP(不是 Service DNS)。minikube/Windows/Docker 下,broker/controller
            # 若 advertise Service DNS(kafka:9092),会经 ClusterIP 回连自己走 hairpin,本地环境常失败,
            # 导致 controller 连不上自身、可用 broker 掉到 0(InvalidReplicationFactorException)。
            # advertise status.podIP 后,集群内(broker 自连 + go 客户端经 metadata)都直连 Pod IP,可达。
            - name: POD_IP
              valueFrom: { fieldRef: { fieldPath: status.podIP } }
            # 集群内单 listener:广播 Pod IP,Service kafka:9092 仅作 bootstrap 入口
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://0.0.0.0:9092" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://$(POD_IP):9092" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "true" }
            - { name: KAFKA_NUM_PARTITIONS, value: "4" }
          ports: [ { containerPort: 9092 } ]
          # broker 启动较慢(要连 zookeeper);给足初始延迟,让 rollout status / 依赖服务能据此等待
          readinessProbe:
            tcpSocket: { port: 9092 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
---
apiVersion: v1
kind: Service
metadata: { name: kafka, namespace: pandora }
spec:
  selector: { app: kafka }
  ports: [ { port: 9092, targetPort: 9092 } ]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: etcd-data
  namespace: pandora
  labels: { app: etcd }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 1Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: etcd, namespace: pandora, labels: { app: etcd } }
spec:
  replicas: 1
  # 单节点 + RWO 数据盘不得 RollingUpdate 并发起两个 etcd；先停旧 Pod 再挂同一 PVC。
  strategy: { type: Recreate }
  # 所有 infra Deployment 会同时 apply；首次冷拉大镜像时，即使 etcd 镜像较小也可能在
  # minikube 下载队列中超过默认 600s，随后 rollout 直接报 ProgressDeadlineExceeded。
  progressDeadlineSeconds: 1800
  selector: { matchLabels: { app: etcd } }
  template:
    metadata: { labels: { app: etcd } }
    spec:
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.6.12
          command:
            - /usr/local/bin/etcd
            - --name=pandora-etcd
            - --data-dir=/etcd-data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd:2379
            - --listen-peer-urls=http://0.0.0.0:2380
            - --initial-advertise-peer-urls=http://etcd:2380
            - --initial-cluster=pandora-etcd=http://etcd:2380
            - --initial-cluster-token=pandora-etcd-cluster
            - --initial-cluster-state=new
            # ⚠️ 关闭 fsync,**仅限本地开发**。生产绝不可照搬(线上也用不到本文件:
            # overlays/online/kustomization.yaml 只引用 ../../services,不含 infra/,
            # 该前提由 tools/scripts/tests/infra_durability_contract_test.ps1 机械断言)。
            #
            # 与同文件 MySQL 那两行同源(INC-20260812-002):etcd **每次提交都要 fsync WAL**,
            # 在 Docker Desktop 虚拟磁盘上是秒级长尾。区别在于 etcd 没有 MySQL
            # `trx_commit=2` 那种"降级但仍持久"的中间档 —— 共识存储刻意不提供,
            # 因为 fsync 正是它对上层承诺"已确认写不回滚"的物理基础。所以要么忍,
            # 要么用官方给的这个开关整个关掉。
            #
            # 本地关掉是安全的,因为 etcd 里存的东西**全部可重建**:
            #   /pandora/leader/、/pandora/writerlease/、/pandora/snowflake/node/、
            #   /pandora/ds-auth/  —— 租约型,本就靠 lease 存活,重新抢占即可;
            #   /pandora/cellroute/table/ —— 配置表版本键,重发布即可;
            #   /pandora/killswitch/ —— 运维开关,本地开发无运维意义。
            # 且仅在**硬崩溃**时丢(优雅重启仍会 flush),比 tmpfs 方案(每次重启必丢)更保守。
            #
            # 生产必须保留 fsync:§9.22 要求 owner 权威"已确认写在故障切换后不回滚",
            # 关掉 fsync 会直接打穿这条不变量,进而打穿 §9.1 的一人一 DS。
            - --unsafe-no-fsync=true
          ports: [ { containerPort: 2379 }, { containerPort: 2380 } ]
          volumeMounts:
            - { name: data, mountPath: /etcd-data }
          readinessProbe:
            exec: { command: ["/usr/local/bin/etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"] }
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 12
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: etcd-data }
---
apiVersion: v1
kind: Service
metadata: { name: etcd, namespace: pandora }
spec:
  selector: { app: etcd }
  ports:
    - { name: client, port: 2379, targetPort: 2379 }
    - { name: peer, port: 2380, targetPort: 2380 }
