# tidb-init:按 deploy/tidb-init/*.sql 顺序初始化(幂等,CREATE IF NOT EXISTS)。
#
# 独立于 tidb.yaml:fresh-genesis 门(start.ps1 [3.5/8])只允许 pandora namespace 预创世
# 存在 Deployment/ReplicaSet/Pod 三类 workload,Job 必须在门后创建(start.ps1 [3.6/8],
# 先删旧 Job 再 apply——Job spec 不可变,SQL 幂等重跑安全)。
# SQL 经 configmap pandora-tidb-init 注入(start.ps1 用 deploy/tidb-init 现场生成,
# 与 pandora-mysql-init 同一模式)。正式发布门禁仍走 deploy/k8s/migrate/job.yaml。
apiVersion: batch/v1
kind: Job
metadata: { name: tidb-init, namespace: pandora, labels: { app: tidb-init } }
spec:
  backoffLimit: 30
  activeDeadlineSeconds: 1800
  template:
    metadata: { labels: { app: tidb-init } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          # 复用 mysql:8.4 的 mysql 客户端(镜像已在节点内,不新增第三方镜像)
          image: mysql:8.4
          command:
            - sh
            - -c
            - |
              set -e
              until mysql -h tidb -P 4000 -u root -e 'SELECT 1' >/dev/null 2>&1; do
                echo 'waiting tidb:4000...'; sleep 5
              done
              for f in /init/*.sql; do
                echo "applying $f"
                mysql -h tidb -P 4000 -u root < "$f"
              done
              echo 'tidb-init done'
          volumeMounts: [ { name: init, mountPath: /init, readOnly: true } ]
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: 500m, memory: 256Mi } }
      volumes:
        - name: init
          configMap: { name: pandora-tidb-init }
