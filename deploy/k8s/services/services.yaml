apiVersion: apps/v1
kind: Deployment
metadata: { name: matchmaker, namespace: pandora, labels: { app: matchmaker } }
spec:
  # ⚠️ 扩到 >1 副本前必须在 matchmaker.yaml 开 match.leader.enabled=true(etcd 选举单写者),
  # 否则每个副本都跑撮合循环 → 重复成局(见 docs/design/decision-revisit-matchmaker-single-writer.md)
  replicas: 1
  selector: { matchLabels: { app: matchmaker } }
  template:
    metadata:
      labels: { app: matchmaker }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "21011"
        prometheus.io/path: /metrics
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch }
      containers:
        - name: matchmaker
          # :dev 是本地开发约定(每次部署由 [5/8] 从当前 HEAD 重建+[6/8] 强制刷新节点 tag;
          # 单独 re-apply 不改 image 串不滚 Pod,无回滚面)。2026-07-28 曾临时钉定 live tag
          # 防"旧树 re-apply 回滚 INC-20260727-001 修复镜像",修复入 main 后钉定动机消失,
          # 回归 :dev——树内容落后于 live 时才需要钉定,钉定 tag 必须有可复现的产出链
          # (参照 fleet yaml:tag=制品版本,Build-DsImagesForMinikube 按版本从制品库重建)。
          image: pandora/matchmaker:dev
          imagePullPolicy: IfNotPresent
          args: ["-conf", "etc/cluster.yaml"]
          ports: [ { containerPort: 20011 } ]
          readinessProbe: { grpc: { port: 20011 }, initialDelaySeconds: 2, periodSeconds: 5, failureThreshold: 3 }
          volumeMounts:
            - { name: conf, mountPath: /app/etc/cluster.yaml, subPath: matchmaker.yaml, readOnly: true }
            - { name: configtable, mountPath: /app/configtable/active, readOnly: true }
            # DSTicket v2(方案 B)RSA 签发私钥(签发方专属,见 login 注释)。
            - { name: dsticket, mountPath: /run/secrets/pandora-dsticket, readOnly: true }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
      volumes:
        - { name: conf, secret: { secretName: pandora-config } }
        - { name: configtable, configMap: { name: pandora-configtable } }
        - { name: dsticket, secret: { secretName: pandora-dsticket-signer-r1, defaultMode: 0440 } }
---
apiVersion: v1
kind: Service
metadata: { name: matchmaker, namespace: pandora }
spec: { selector: { app: matchmaker }, ports: [ { port: 20011, targetPort: 20011 } ] }
