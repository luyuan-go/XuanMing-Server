apiVersion: apps/v1
kind: Deployment
metadata: { name: push, namespace: pandora, labels: { app: push } }
spec:
  replicas: 1
  # RollingUpdate(默认)= 不停服硬要求(§9.16/§9.21;Recreate 全量断流被审计否决)。
  # 滚动重叠窗的正确性由投递缓冲保证:每帧先入 redis 缓冲(游标权威)再 best-effort
  # 实时转发,消息被"不持有连接的 Pod"消费只降级为缓冲交付,客户端重连按游标补推,
  # 零丢失(见 push data/offline.go 邮箱模型)。多副本常态化仍需连接 owner 路由
  # (实时时延优化,非正确性前提),见 online overlay 注释。
  selector: { matchLabels: { app: push } }
  template:
    metadata:
      labels: { app: push }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "51014"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: push
          image: pandora/push:dev
          imagePullPolicy: IfNotPresent
          args: ["-conf", "etc/cluster.yaml"]
          ports: [ { containerPort: 50014 } ]
          readinessProbe: { grpc: { port: 50014 }, initialDelaySeconds: 2, periodSeconds: 5, failureThreshold: 3 }
          volumeMounts: [ { name: conf, mountPath: /app/etc/cluster.yaml, subPath: push.yaml, readOnly: true } ]
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
      volumes: [ { name: conf, secret: { secretName: pandora-config } } ]
---
apiVersion: v1
kind: Service
metadata: { name: push, namespace: pandora }
spec: { selector: { app: push }, ports: [ { port: 50014, targetPort: 50014 } ] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: leaderboard, namespace: pandora, labels: { app: leaderboard } }
