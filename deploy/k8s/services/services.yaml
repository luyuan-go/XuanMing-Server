---
apiVersion: apps/v1
kind: Deployment
metadata: { name: ds-allocator, namespace: pandora, labels: { app: ds-allocator } }
spec:
  # 2 副本 + RollingUpdate(2026-07-29 事故闭环)。此前是 replicas:1 + Recreate,而
  # ds-allocator 整个进程被 dsauthfence capability 门控、失租即 os.Exit(1) —— 于是**任何**
  # 重启(崩溃 / 失租 / 例行换镜像)都会让 DSAllocatorService/Heartbeat 整体不可用,而
  # Battle DS 在 pkg/placement.DSFenceLeaseMaxSeconds=20s 内拿不到凭据绑定 ACK 就会自我
  # fencing 踢掉全部在场玩家。2026-07-29 06:13 实测一次失租→重新 Ready 用了 160s(≈8× 租约),
  # §16.8「重启预算必须闭合」不成立,验收底线 7「升级不得打断对局」被破。
  #
  # 修的是可用性,不是 fencing:capability key 按 (service, PodUID) 唯一(pkg/dsauthfence
  # 注释),异 Pod 副本各持异 key、永不互相接管,故多副本本就共存;唯一需要串行的
  # 「同一未分区权威的单写者循环」是心跳超时扫描,已由 allocator.writer_lease_mode=enforce
  # 的 etcd 选举(election=ds_allocator/sweep)承担。其余写路径按 match_id 分区并在 Redis
  # 事务内按精确凭据身份 CAS,属 §9.21 的「可并行 worker + 幂等 CAS」,不串行化。
  #
  # 原 Recreate 的理由(INC-20260727-001 warming 双阈值首次引导升级)是一次性的:旧二进制
  # 的 sweep 对 warming 恒用 15s 单阈值。该版本已全量铺开,新旧语义一致,例外到期。
  #
  # ⚠ 首次滚动到「含 writerlease 的镜像」必须两步走,否则重叠窗口里旧二进制不参与竞选、
  #   不受选举约束 = 无保护并发扫描:
  #     ① 先临时改回 strategy:{type:Recreate} + replicas:1 只换镜像;
  #     ② 待新镜像全量后再单独 apply 本 strategy/replicas(strategy 变更不重建 Pod,零额外窗口)。
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: ds-allocator } }
  template:
    metadata:
      labels: { app: ds-allocator, pandora.dev/ds-auth-writer-epoch: "2" }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "21020"
        prometheus.io/path: /metrics
        # 机械门禁:必须与本 Deployment 的 spec.strategy.type 逐字一致(cmd/ds_allocator/
        # main_test.go 的清单契约测试钉住)。进程读它做 fail-closed 校验:
        # RollingUpdate × writer_lease_mode!=enforce 直接启动失败,不留无保护并发扫描组合。
        pandora.dev/deploy-strategy: "RollingUpdate"
    spec:
      serviceAccountName: pandora-allocator   # Agones API 权限(agones 模式下需要;mock 不用但无害)
      # 两副本必须落在不同节点:同节点共命运(本次事故正是单节点落盘 I/O 卡死),
      # 同时挂掉就等于没有多副本。单节点开发集群下 preferred 不会阻塞调度。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector: { matchLabels: { app: ds-allocator } }
      containers:
        - name: ds-allocator
          # :dev 回归理由见 matchmaker 注释(修复已入 main,临时钉定动机消失)。
          image: pandora/ds-allocator:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: PANDORA_POD_UID, valueFrom: { fieldRef: { fieldPath: metadata.uid } } }
            - { name: PANDORA_IMAGE_DIGEST, valueFrom: { fieldRef: { fieldPath: "metadata.annotations['pandora.dev/image-digest']" } } }
            - { name: PANDORA_DEPLOY_STRATEGY, valueFrom: { fieldRef: { fieldPath: "metadata.annotations['pandora.dev/deploy-strategy']" } } }
          args: ["-conf", "etc/cluster.yaml"]
          # 21020 是运维面 HTTP(/metrics + /healthz/writer)。此前只声明 20020,而
          # prometheus.io/port 指向 21020 —— 集群内根本没有到写者指标的路径(同 hub_allocator
          # R11 P0-2)。sum(pandora_ds_allocator_writer_held)==0 是「长期无人扫描」的告警信号。
          ports: [ { name: grpc, containerPort: 20020 }, { name: ops-http, containerPort: 21020 } ]
          # readiness 只看 gRPC:热备副本(未当选扫描者)照常服务 Heartbeat/AllocateBattle,
          # 绝不能把 readiness 门成"必须是写者"——那会在滚动升级时死锁,并把"扫描降级"
          # 放大成"整服零 allocator 端点",正是本次要消除的东西。
          readinessProbe: { grpc: { port: 20020 }, initialDelaySeconds: 2, periodSeconds: 5, failureThreshold: 3 }
          volumeMounts:
            - { name: conf, mountPath: /app/etc/cluster.yaml, subPath: ds-allocator.yaml, readOnly: true }
            # 关卡表:本服按 map_id 查 g_关卡.xlsx 得关卡资源与 GameMode 类(§9.22 唯一权威源)。
            # config_table.dir 非空 = 启动强依赖,加载失败即退出;挂载缺失会 CrashLoopBackOff。
            # 与 player / matchmaker / matchmaker-pve / battle-result 同一 ConfigMap、同一挂载点。
            - { name: configtable, mountPath: /app/configtable/active, readOnly: true }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
      volumes:
        - { name: conf, secret: { secretName: pandora-config } }
        - { name: configtable, configMap: { name: pandora-configtable } }
---
# PDB:滚动升级/节点排空时至少保留 1 个可服务副本。没有它,kubectl drain 会把两个
# 副本一起赶走,Heartbeat 断流 >20s,全部在场对局被 Battle DS 自我 fencing 踢掉。
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: ds-allocator, namespace: pandora }
spec:
  minAvailable: 1
  selector: { matchLabels: { app: ds-allocator } }
---
apiVersion: v1
kind: Service
metadata: { name: ds-allocator, namespace: pandora }
spec:
  selector: { app: ds-allocator }
  ports:
    - { name: grpc, appProtocol: grpc, port: 20020, targetPort: 20020 }
    - { name: ops-http, appProtocol: http, port: 21020, targetPort: 21020 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: hub-allocator, namespace: pandora, labels: { app: hub-allocator } }
spec:
  replicas: 1
  # hub-allocator 是 assignment/容量账本的单写者。R9 P0-7 起单写者约束不再依赖
  # Recreate 部署策略,而由运行时写者继任租约保证(pkg/dsauthfence/writerlease:
  # etcd election + 单调 fencing token + Redis 同事务存储级 fencing,见
  # docs/design/session-generation-rollout.md §5)。RollingUpdate 重叠窗口内
  # 未当选副本对写请求返回可重试 UNAVAILABLE,迟到旧写者被存储层 fence 拒绝。
  # maxUnavailable=0 保证升级全程始终有副本在服务(旧副本收 SIGTERM 时主动 Resign,
  # 新副本亚秒接任)。
  # 迁移警告:首次从不含 writerlease 的旧镜像升级时,旧二进制不参与竞选也不受 fence
  # 约束,滚动重叠 = 无保护双写窗口;首次升级按 rollout 文档 §5.3 两步法:先保持
  # Recreate 只换镜像,再单独 apply 本 strategy(strategy 变更不重建 Pod,零额外窗口)。
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: hub-allocator } }
  template:
    # R11 复审 P0-2:写者状态必须可被抓取端自动采集,不能只靠人工逐 Pod 直连。运维面
    # HTTP 21021 同时提供 /metrics 与写者健康页;此前 containerPort 只声明 20021,
    # Service 也只暴露 20021,集群内根本没有到写者指标的路径。
    # prometheus.io/* 注解供 pod service-discovery 抓取(写者指标见 internal/server/http.go)。
    metadata:
      labels: { app: hub-allocator, pandora.dev/ds-auth-writer-epoch: "2" }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "21021"
        prometheus.io/path: /metrics
        # R11 复审 P0-5 机械门禁:必须与本 Deployment 的 spec.strategy.type 逐字一致
        # (main_test.go 的清单契约测试钉住)。进程读它做 fail-closed 校验:
        # RollingUpdate × writer_lease_mode!=enforce 直接启动失败,不留无保护双写组合。
        pandora.dev/deploy-strategy: "RollingUpdate"
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch }
      serviceAccountName: pandora-allocator   # Agones API 权限(agones 模式下需要;mock 不用但无害)
      containers:
        - name: hub-allocator
          image: pandora/hub-allocator:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: PANDORA_POD_UID, valueFrom: { fieldRef: { fieldPath: metadata.uid } } }
            - { name: PANDORA_IMAGE_DIGEST, valueFrom: { fieldRef: { fieldPath: "metadata.annotations['pandora.dev/image-digest']" } } }
            - { name: PANDORA_DEPLOY_STRATEGY, valueFrom: { fieldRef: { fieldPath: "metadata.annotations['pandora.dev/deploy-strategy']" } } }
          args: ["-conf", "etc/cluster.yaml"]
          ports:
            - { name: grpc, containerPort: 20021 }
            - { name: http-metrics, containerPort: 21021 }
          readinessProbe: { grpc: { port: 20021 }, initialDelaySeconds: 2, periodSeconds: 5, failureThreshold: 3 }
          volumeMounts:
            - { name: conf, mountPath: /app/etc/cluster.yaml, subPath: hub-allocator.yaml, readOnly: true }
            # DSTicket v2(方案 B)RSA 签发私钥(签发方专属,见 login 注释)。
            - { name: dsticket, mountPath: /run/secrets/pandora-dsticket, readOnly: true }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
      volumes:
        - { name: conf, secret: { secretName: pandora-config } }
        - { name: dsticket, secret: { secretName: pandora-dsticket-signer-r1, defaultMode: 0440 } }
---
apiVersion: v1
kind: Service
metadata: { name: hub-allocator, namespace: pandora }
spec:
  selector: { app: hub-allocator }
  ports:
    - { name: grpc, port: 20021, targetPort: 20021 }
    # 运维面(/metrics + /healthz/writer)。仅集群内可达,不经 Envoy 对外暴露。
    - { name: http-metrics, port: 21021, targetPort: 21021 }
---
# P0#5:hub-allocator round_robin 客户端 LB 用的 headless Service(clusterIP:None → DNS 返回
# 全部 **Ready** Pod IP)。login 经 dns:///hub-allocator-headless.pandora.svc.cluster.local:20021
# + round_robin 拨号(见 login main.go / grpcclient.MustDialInsecureRoundRobin):滚动重叠
# (maxSurge=1 双 Pod)期间对「非-writer 可重试错误」重发时每次 RPC 轮到不同副本,数次内命中
# 当前 writer,消除「连接被 L4 钉在非-writer Pod」。上面的 ClusterIP Service 保留给单发调用方 /
# 探针,不受影响。**LB 分发效果须在集群内冒烟验证(观察 RPC 落到多个 Pod),本机无法验证。**
apiVersion: v1
kind: Service
metadata: { name: hub-allocator-headless, namespace: pandora }
spec:
  clusterIP: None
  selector: { app: hub-allocator }
  ports: [ { name: grpc, appProtocol: grpc, port: 20021, targetPort: 20021 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: battle-result, namespace: pandora, labels: { app: battle-result } }
spec:
  replicas: 1
  selector: { matchLabels: { app: battle-result } }
  template:
    metadata:
      labels: { app: battle-result, pandora.dev/ds-auth-writer-epoch: "2" }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "21022"
        prometheus.io/path: /metrics
    spec:
      containers:
        - name: battle-result
          image: pandora/battle-result:dev
          imagePullPolicy: IfNotPresent
          env:
            - { name: PANDORA_POD_UID, valueFrom: { fieldRef: { fieldPath: metadata.uid } } }
            - { name: PANDORA_IMAGE_DIGEST, valueFrom: { fieldRef: { fieldPath: "metadata.annotations['pandora.dev/image-digest']" } } }
          args: ["-conf", "etc/cluster.yaml"]
          ports: [ { containerPort: 20022 } ]
          readinessProbe: { grpc: { port: 20022 }, initialDelaySeconds: 2, periodSeconds: 5, failureThreshold: 3 }
          volumeMounts:
            - { name: conf, mountPath: /app/etc/cluster.yaml, subPath: battle-result.yaml, readOnly: true }
            # 怪物击杀经验的唯一数值权威(role_level 表)。本服**启动强依赖**:
            # 缺卷 / 缺表 → 进程直接退出。理由见 main.go 6.1.9 —— 表缺失时每条击杀事实
            # 都会被按可重试错误退回,服务带病跑没有任何意义。
            - { name: configtable, mountPath: /app/configtable/active, readOnly: true }
          resources: { requests: { cpu: 25m, memory: 64Mi }, limits: { cpu: "1", memory: 256Mi } }
      volumes:
        - { name: conf, secret: { secretName: pandora-config } }
        - { name: configtable, configMap: { name: pandora-configtable } }
---
apiVersion: v1
kind: Service
metadata: { name: battle-result, namespace: pandora }
spec: { selector: { app: battle-result }, ports: [ { port: 20022, targetPort: 20022 } ] }
