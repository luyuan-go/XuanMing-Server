# pandora-battle-stable Fleet（Stable 轨，W4 ⑬）
#
# 战斗 DS 走 Agones「按需分配」模型：matchmaker 全员确认 → ds_allocator POST
# GameServerAllocation（selector 同时匹配 agones.dev/fleet=pandora-battle-stable 与
# pandora.dev/release-track=stable）→ 拿到一个 Ready
# GameServer 转 Allocated，返回 address:port 给客户端进战斗。
#
# 当前直接使用真 UE Pandora Battle DS 镜像（Agones SDK Ready/Health + Pandora 业务 Heartbeat）。
# Fleet Ready 只证明 Agones 生命周期正常；分配闭环还必须看到 DS 经 :8444 向 ds_allocator
# 上报正确 match_id/pod 的业务心跳，二者是两条独立链路（见 README「分两步验证」）。
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: pandora-battle-stable
  namespace: default
  labels:
    app.kubernetes.io/part-of: pandora
    pandora.dev/role: battle
    pandora.dev/release-track: stable
spec:
  # 初始副本数。本 Fleet 由 25-fleetautoscaler-battle.yaml(Buffer 策略)接管伸缩:
  # 常备 bufferSize 个 Ready 预热,分配走一个自动补一个,同时最大局数 = maxReplicas。
  # 扩容改 autoscaler 的 maxReplicas,不要改这里。
  replicas: 2
  template:
    metadata:
      labels:
        pandora.dev/role: battle
        pandora.dev/release-track: stable
        pandora.dev/ds-auth-writer-epoch: "2"
      annotations:
        pandora.dev/release-track: stable
    spec:
      ports:
        - name: default
          portPolicy: Dynamic
          containerPort: 7777
          protocol: UDP
      health:
        initialDelaySeconds: 15
        periodSeconds: 10
        # 按 INC-20260727-001 回收计划收回 3:health ping 已改由 FPandoraAgonesHealthPinger
        # 独立 FRunnable 线程驱动(客户端 r1553,间隔 5s,完成委托留在 HTTP 线程,零游戏线程
        # 依赖),重图同步加载(BlockTillLevelStreamingCompleted)期间发拍不断流,"正在加载"
        # 不再被误判成死进程;真死进程 3×10s≈30s 判死,fleet 快速替换补位。
        # ⚠️ apply 顺序硬门:必须先部署含 r1553 pinger 的 DS 镜像,并用
        # `Log LogPandoraAgonesHealth Verbose` 实测一次 Artic01 冷加载期发拍连续后,
        # 才能 apply 本值;对旧镜像(游戏线程 TimerManager 驱动)生效会复现加载期误杀。
        failureThreshold: 3
      template:
        metadata:
          labels:
            pandora.dev/ds-auth-writer-epoch: "2"
            pandora.dev/release-track: stable
          annotations:
            pandora.dev/release-track: stable
        spec:
          containers:
            - name: pandora-battle-ds
              # Pandora 战斗 DS（UE Linux Dedicated Server）。
              # 由 Tool/Server/Agones/build-linux-ds.ps1 + build-image.sh 产出镜像；push 由人手动执行，按实际 registry 覆盖。
              # Agones 自动注入 SDK sidecar；DS 内 UPandoraAgonesSubsystem 走 sidecar HTTP 调 Ready/Health/Shutdown。
              # 镜像一律钉**不可变 tag**(发布纪律,INC-20260727-001 复审 P1-4):本文件是集群
              # desired state,钉 :dev 滚动 tag 会让任意一次 kubectl apply 把 live 降回本机
              # IfNotPresent 缓存里的旧 :dev 构建。换版流程 = 打新不可变 tag → minikube image
              # load → 改本行 → apply;严禁回填 :dev。
              # 当前本地开发镜像:r1949-dirty-20260810-054629
              # (tag = 制品库快照版本号,契约见 start.ps1 Build-DsImagesForMinikube:宿主 docker
              # 缺该镜像时会按此名去制品库定位包并自动重建同名镜像,任何可达制品库的机器可复现。
              # 制品:<PANDORA_ARTIFACT_ROOT>\snapshots\client\trunk_Client\
              # Server_Linux_Development\r1949-dirty-20260810-054629\LinuxServer,
              # PandoraServer sha256 AB7D3D3E…E8C9639,293,630,712 字节,二进制 2026-08-10 05:41 编译,
              # BUILD_INFO: FullBuild Revision=1949 Time=2026-08-10 05:46,发布于 05:49)。
              #
              # ⚠️ tag 里的 r<数字> **不是源码 revision 凭据**:发布器取的是发布时刻
              # `svnversion` 的上界,工作副本混合版本(实测 1719:1833M)时它只是其中最高的那个,
              # 尾部 M 还表示有未提交改动;包内 BUILD_INFO 的 Revision 又是另一个口径(工作副本
              # 根节点 revision)。要确认"跑的到底是哪份包",只能比对上面那个 PandoraServer sha256。
              #
              # 换版沿革:2026-08-05 由 r1707-dirty-dbcbba84-20260804-100500z(非最新源码,且该 tag
              # 在制品库查无快照、只存在于原机 docker,换机器必 ImagePullBackOff)先换到 r1833,
              # 同日客户端又出了 r1835,遂跟到本 tag。两者均已随发布进制品库,无上述缺口。
              # 2026-08-07 换到 r1918:内容 = Jenkins client-dev #76 的 Linux DS 产物
              # (Packages\Server_Linux_Development,BUILD_INFO Revision=1918)。该包**本来就没进
              # 制品库** —— client-dev 的 Publish 阶段把 `-Flavors A B` 写成空格分隔,PowerShell
              # 只把第一个裸值绑给 -Flavors、第二个溢出到位置参数 $ArtifactRoot,于是 #74~#76 只发布了
              # Client_Win64_Development 且发进了工作区里的错误目录,DS 包一次都没发出去,发布阶段
              # 却报 SUCCESS。制品库因此停在 08-05 的 r1835,集群跟着跑了两天前的 DS 代码。
              # 客户端仓 Tool/Build/Jenkinsfile 的逗号分隔修复后来已生效;2026-08-10 Jenkins
              # client-dev #101 同时原子发布 Client 与 DS。本 tag 即 #101 的 Linux DS 产物,
              # sha256 已在宿主镜像与 Minikube 节点镜像构建前逐字节核对。
              #
              # ⚠️ 换版必须改本行再 apply。历史教训:2026-07-31 曾有人绕过本文件直接改集群,
              # 结果 live 跑着 r1642-dirty-9ab0ee7f-20260731-130850 而本文件还写着 r1604,
              # 且那个 tag 在制品库里查无快照 —— 任何一次 apply 都会把 live 打回旧版,
              # 换机器更是直接 ImagePullBackOff。
              image: pandora/battle-ds:r1949-dirty-20260810-054629
              imagePullPolicy: IfNotPresent
              env:
                - name: PANDORA_DS_PORT
                  value: "7777"
                # 「填表即用」权威路径(2026-07-07 启用):DS 统一启到空入口图 Lvl_Server_Entry(包内已有,
                # 无需新建 Lvl_DS_Loader),由 PandoraDSLoaderGameMode 等 Agones Allocated + pandora.dev/map-id
                # label 就绪后查 g_关卡.xlsx → ServerTravel 到目标副本(GameModeClass 也由表行决定)。
                # 之后策划新增副本只改表 + 重打 DS 内容,本 Fleet 无需改。见 Doc/服务器/副本选择_UE侧交接_Codex.md。
                # 前提:镜像必须是含 APandoraDSLoaderGameMode + 关卡上下文修复(2026-07-07)的新构建。
                - name: PANDORA_DS_MAP
                  value: "/Game/Entry/Level/Lvl_Server_Entry"
                - name: PANDORA_DS_GAMEMODE
                  value: "/Script/Pandora.PandoraDSLoaderGameMode"
                # 旧直启路径(回退用,仅当 Loader 镜像未就绪时换回):直接启到固定战斗图 + 战斗 GameMode。
                # 业务心跳(DS→ds_allocator.Heartbeat,每 5s)在 PostLoadMapWithWorld(世界初始化
                # 完成)后才启动(INC-20260727-001 P0 修复)。直启会绕过按 map_id 选图,所有局都进同一张图。
                #   value: "/Game/Test/Level/MobaLevel"               # ← PANDORA_DS_MAP
                #   value: "/Script/Pandora.PandoraBattleGameMode"    # ← PANDORA_DS_GAMEMODE
                #
                # 进阶(热门图零加载延迟,标准混合形态):可为单张热门图克隆本 Fleet 建「专属预热 Fleet」——
                # 另建专用 Stable Fleet 时改 metadata.name(如 pandora-battle-stable-songlin)+ 上面两行 env
                # (如 /Game/Test/Level/SonglinTown + /Script/Pandora.PandoraPveGameMode),
                # 并在 ds_allocator agones.map_fleets 配 map_id→该 Fleet。分配时 Agones 有序 selectors
                # 先选专属池(Pod 已预载目标图,分配即可玩),无空闲自动回落本通用 Loader 池。
                # 长尾/新副本不建专属 Fleet,走本池填表即用。
                # ds_allocator 的 grpc-web 入口。DS 走 grpc-web（FHttpModule），不能直连裸 gRPC :20020，
                # 必须打到 Envoy 的「DS 面」grpc-web 监听器 :8444（grpc-web→gRPC 转换，按方法白名单
                # 路由到 ds_allocator，见 deploy/k8s/agones/16-ds-envoy.yaml）。
                # ⚠️ :8444 DS 面是**明文无 TLS**(权威口径见 docs/design/gateway-decision.md §「DS 面」),
                #    故 PANDORA_DS_ALLOCATOR_TLS=0;此处不做 TLS 终止,别被旧注释误导。
                # 默认代码值 127.0.0.1:20020 是裸端口，集群里打不通——务必用下面 env 覆盖。
                #
                # 线上同款:DS 走集群内 Envoy「DS 面」Service DNS 回连,pod 内绝不写宿主 IP / host.docker.internal
                # (minikube 的 Pod 解析不了 host.docker.internal,DNS 失败 → 心跳发不出 → 匹配 4001)。
                # in-cluster Envoy 由 deploy/k8s/agones/16-ds-envoy.yaml 部署在 pandora 命名空间。
                # 线上真集群边缘网关自带同名 pandora-envoy Service,本段 env 一字不改即可切线上。
                - name: PANDORA_DS_ALLOCATOR_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                - name: PANDORA_DS_ADMISSION_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                - name: PANDORA_PLAYER_LOCATOR_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                - name: PANDORA_BATTLE_RESULT_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                # bag 域 journal 直写(bag-domain.md phase 2 拾取入包;同一 DS 面 Envoy)
                - name: PANDORA_BAG_SERVICE_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                - name: PANDORA_DS_ALLOCATOR_TLS
                  value: "0"
                # DSTicket v2(方案 B,RS256 纯本地验票,决策文档 §7):DS 只持公钥 JWKS,无任何玩家票
                # 签名 secret(玩家 HS256 密钥出现在 Fleet 里会被 online_manifest_contract 硬拒)。
                # 公钥来自不可变 ConfigMap pandora-dsticket-jwks-r1(见 15-dsticket-jwks.yaml)。普通
                # Stable/Canary 发布只读对账、不换钥；当前发布器不支持 public-only K2 stage。
                # 两个 env 与 UE FPandoraDSTicketKeystore 约定一致:缺任一个 = v2 未配置,
                # Agones Ready 门(FPandoraDSTicketReadyGatePolicy)会拒绝 Ready,容器不会半配置上线。
                - name: PANDORA_DSTICKET_JWKS_FILE
                  value: "/etc/pandora/dsticket/jwks.json"
                - name: PANDORA_DSTICKET_KEYSET_REVISION
                  value: "1"
                # 2026-08-01：开启服务端 World Partition 流送。
                #
                # 不开时 DS 会在 BeginPlay 的 BlockTillLevelStreamingCompleted 里**一次性**
                # 加载整张图并同步创建全部碰撞体，Artic01 实测「DS 物理体普查」= 开碰撞图元
                # 18,623 个（PCGPartitionActor 15,855 占 85%、LandscapeStreamingProxy 1,024），
                # GameThread 被阻塞约 14s。后果不是崩溃而是**业务心跳断供**：Agones /health
                # 跑在独立线程照常应答（所以 GameServer 一直显示健康），但 ds_allocator 的
                # HeartbeatTimeout=15s 走的是 GameThread 驱动的业务心跳，14s 空窗恰好触顶
                # → 判定 DS 失联 → 回收 Pod → 玩家连接被切 → 客户端 60s ConnectionTimeout
                # → 被弹回选角。
                #
                # 开启后实测同一张图：开碰撞图元 18,623 → 49，世界就绪从 ~14s → 亚秒，
                # hang 0 次。只放在 Fleet env 而不进 DefaultEngine.ini，是为了**只作用于专用
                # 服务器**，不改变客户端与 PIE 的行为。
                #
                # 代价（已知且必须知晓）：服务端只加载 streaming source（玩家）附近的 cell，
                # 远处 Actor 在服务端不存在。刷怪已按此设计（SpawnActivationRadius=25600
                # 与 WP CellSize 对齐）；新增依赖"全图 Actor 常驻服务端"的玩法前需复核。
                #
                # 2026-08-03：追加两个 Chaos 加速结构时间切片参数，治「玩家一移动就整秒卡死」。
                #
                # 画像实锤（map8 405s 战斗窗，官方 Insights）：玩家移动 → WP 流送换 cell →
                # PCG 岩石 ISM 数千静态粒子一次性入队 → 击穿引擎默认
                # AccelerationStructureTimeSlicingMaxQueueSizeBeforeForce=1000 →
                # ForceFullBuild（PBDRigidsEvolution.cpp:912，构建不切片 :185、外部结构拷贝
                # 无上限一次拷完 :411）→ TG_EndPhysics CreateExternalAccelerationStructure
                # 单帧 3.58s / TG_StartPhysics 0.78s，帧 I.Max 5.24s，游戏线程整帧停摆，
                # 移动输入无人处理（业务心跳相邻间隔同窗实测 6~8.4s 尖峰）。
                #
                # MaxQueueSizeBeforeForce=1000000：cell 交换永不触发全量重建，走引擎自带的
                # 分帧构建路径（新增静态体在 dirty 树中可查询，正确性由引擎既有机制保证）。
                # MaxBytesCopy=100KB→2MB/帧：175MB 外部结构（LLM ChaosAcceleration 实测峰值）
                # 约 90 帧摊完，单帧 2MB memcpy 亚毫秒；默认 100KB 需 1750 帧，追赶期过长。
                # 治本（资产侧）另行进行：63 个 CTF_UseComplexAsSimple 岩石凸包化 + 纯装饰岩
                # DS 去碰撞，粒子量降下来后多数 cell 交换根本不再接近阈值。
                - name: PANDORA_DS_EXTRA_ARGS
                  value: "-dpcvars=wp.Runtime.EnableServerStreaming=1,p.Chaos.AccelerationStructureTimeSlicingMaxQueueSizeBeforeForce=1000000,p.Chaos.AccelerationStructureTimeSlicingMaxBytesCopy=2000000"
              volumeMounts:
                - name: dsticket-jwks
                  mountPath: /etc/pandora/dsticket
                  readOnly: true
              resources:
                requests:
                  cpu: "1"
                  # 内存 request=limits:战斗 DS 峰值内存是确定性的地图加载成本,不是可
                  # 超卖的突发 —— 用 1Gi request 超卖会让并发加载时节点真实耗尽、被
                  # kubelet 驱逐或 OOM(INC-20260727-002 复审)。CPU 保持 request<limit
                  # (可压缩资源,突发无害),因此 QoS 是 Burstable **不是 Guaranteed**,
                  # 本注释不做 Guaranteed 声称;内存安全性由 request=limits 单独成立。
                  # 调度容量约束由此真实生效:minikube 外层实际 40Gi ÷ 14Gi → 本地 2 台,
                  # 与 25-fleetautoscaler maxReplicas=2 对齐。
                  memory: 14Gi
                limits:
                  # 2026-08-01 曾试上调 2→8 排查 DS GameThread 卡死，**已实测证伪并回退**：
                  # 提到 8 核后同一张图仍然 hang（阻塞仍约 14s），证明瓶颈不在 CFS 配额，
                  # 而在 BlockTillLevelStreamingCompleted 里同步创建的 18,623 个碰撞体本身。
                  # 真正的修复是开启服务端 WP 流送（见下方 PANDORA_DS_EXTRA_ARGS），
                  # 开启后开碰撞图元 18,623 → 49。没有证据支持加核，故按原值保留。
                  cpu: "2"
                  # 正式值推导(INC-20260727-002):故障注入部署实测完整加载 memory.peak=
                  # 11,200,929,792B≈10.43GiB;按事故档案口径 peak×1.3~1.5=13.56~15.65GiB,
                  # 取 14Gi(×1.34)。历史:2Gi 被 OOM 杀(dmesg 9 例)→12Gi 量测围栏→本值。
                  # 资产减负(INC-001 A5)落地后应重测回调。
                  memory: 14Gi
          volumes:
            # DSTicket v2 公钥 JWKS(只读,公钥非机密,用 ConfigMap 而非 Secret;由启动器/运维从
            # dsticket_keyset.ps1 create-only 投递的 jwks.json，私钥绝不进 DS 镜像/Pod)。
            - name: dsticket-jwks
              configMap:
                name: pandora-dsticket-jwks-r1
