# pandora-hub-canary Fleet（Canary 轨，W4 ⑬）
#
# 大厅 Hub DS 走「常驻分片」模型（不同于战斗 DS 的按需分配）：Hub DS GameServer 持续
# Ready 运行，hub_allocator 经 AgonesHubFleetProvider LIST 这些 GameServer 发现分片拓扑
# （selector agones.dev/fleet=pandora-hub-canary,pandora.dev/release-track=canary,
# pandora.dev/region=<region>），自己在 Redis 里
# 维护各分片 player_count 做容量判定（500 人/实例），不走 Agones GameServerAllocation。
#
# region 标签必填：hub_allocator 按 pandora.dev/region 过滤分片;本 dev Fleet 标 region=cn。
# capacity 标签可选：单分片人数上限（缺省用 hub.default_capacity=500）。
# shard-id 标签可选:同 Fleet 多副本无法静态区分,缺省由 hub_allocator 按 pod 名哈希派生。
#
# 当前直接使用真 UE Pandora Hub DS 镜像。Fleet Ready 证明 Agones SDK 生命周期正常；
# Hub DS 还须经 :8444 向 hub_allocator 上报业务心跳，见 ds-arch.md。
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: pandora-hub-canary
  namespace: default
  labels:
    app.kubernetes.io/part-of: pandora
    pandora.dev/role: hub
    pandora.dev/release-track: canary
spec:
  replicas: 0
  template:
    metadata:
      labels:
        pandora.dev/role: hub
        pandora.dev/release-track: canary
        pandora.dev/ds-auth-writer-epoch: "2"
        pandora.dev/region: cn
        pandora.dev/capacity: "500"
      annotations:
        pandora.dev/release-track: canary
    spec:
      ports:
        - name: default
          portPolicy: Dynamic
          containerPort: 7777
          protocol: UDP
      health:
        initialDelaySeconds: 15
        periodSeconds: 10
        failureThreshold: 3
      template:
        metadata:
          labels:
            pandora.dev/ds-auth-writer-epoch: "2"
            pandora.dev/release-track: canary
          annotations:
            pandora.dev/release-track: canary
        spec:
          containers:
            - name: pandora-hub-ds
              # Pandora 大厅 DS（UE Linux Dedicated Server）。镜像产出同 battle；push 由人手动执行，按实际 registry 覆盖。
              # Agones 自动注入 SDK sidecar；DS 内 UPandoraAgonesSubsystem 走 sidecar HTTP 调 Ready/Health/Shutdown。
              # 镜像一律钉**不可变 tag**,与 30-fleet-hub.yaml 同改同收(P1-4,§9.21;推导与换版
              # 流程见该文件注释)。canary 轨换新版本时改本行为新的不可变 tag。
              # 2026-08-12 与 stable 同步换到完整发布快照 r1977-dirty-20260812-031503
              # (四份 Fleet 同版:battle/hub × stable/canary;精确制品 hash 见 30-fleet-hub.yaml)。
              # 与 battle 同一构建;hub 与 battle 不同版会让玩家 travel 时撞上不同的
              # PandoraNetProtocolVersion(依据见 30-fleet-hub.yaml 该行注释)。
              # ⚠️ 漏改 canary 的代价见 21-fleet-battle-canary.yaml 该行注释:start.ps1 会为残留的
              # 旧 tag 去制品库重建镜像,把 stage 降级覆盖,一键启动在降级守卫处 fail-closed 中断。
              # 注:canary 与 stable 钉同一 tag = 灰度轨当前无差异版本;真正灰度时本行必须换成
              # 与 stable **不同** digest 的新镜像。
              image: pandora/hub-ds:r2085-dirty-20260817-121023
              imagePullPolicy: IfNotPresent
              env:
                - name: PANDORA_DS_PORT
                  value: "7777"
                - name: PANDORA_DS_MAP
                  value: "/Game/Test/Level/MainCity"
                - name: PANDORA_DS_GAMEMODE
                  value: "/Script/Pandora.PandoraHubGameMode"
                - name: PANDORA_DS_MAX_PLAYERS
                  value: "500"
                # 线上同款:走集群内 Envoy「DS 面」Service DNS(见 16-ds-envoy.yaml),不写 host.docker.internal。
                - name: PANDORA_HUB_ALLOCATOR_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                - name: PANDORA_DS_ADMISSION_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                - name: PANDORA_PLAYER_LOCATOR_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                # bag 域 journal 直写 + 邮件三段式领取(bag-domain.md phase 2;同一 DS 面 Envoy)
                - name: PANDORA_BAG_SERVICE_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                - name: PANDORA_MAIL_SERVICE_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                - name: PANDORA_TEAM_SERVICE_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                - name: PANDORA_GUILD_SERVICE_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                # DS 拉玩家出战快照 GetLoadout(专精 / 预设装备);PlayerState 初始化即查,同一 DS 面 Envoy。
                # 缺这一条时 DS 会退回 .h 里的 127.0.0.1:20002 默认值 —— Pod 内没人监听,
                # 玩家整局没装备没专精且只在 DS 日志里留一行 warn(2026-08-13 实伤)。
                - name: PANDORA_PLAYER_SERVICE_ADDR
                  value: "pandora-envoy.pandora.svc.cluster.local:8444"
                - name: PANDORA_DS_ALLOCATOR_TLS
                  value: "0"
                # DSTicket v2(方案 B)公钥 JWKS 配置,与 battle Fleet 完全同款(见 20-fleet-battle.yaml 注释):
                # 缺任一个 env 或 JWKS 解析失败,Agones Ready 门拒绝 Ready,容器不会半配置上线。
                - name: PANDORA_DSTICKET_JWKS_FILE
                  value: "/etc/pandora/dsticket/jwks.json"
                - name: PANDORA_DSTICKET_KEYSET_REVISION
                  value: "1"
              volumeMounts:
                - name: dsticket-jwks
                  mountPath: /etc/pandora/dsticket
                  readOnly: true
              resources:
                requests:
                  cpu: "1"
                  memory: 1Gi
                limits:
                  cpu: "2"
                  memory: 2Gi
          volumes:
            # DSTicket v2 公钥 JWKS(只读;公钥非机密用 ConfigMap;私钥绝不进 DS Pod)。
            - name: dsticket-jwks
              configMap:
                name: pandora-dsticket-jwks-r1
