# Pandora trade 服务开发期配置(2026-06-16)。
#
# - gRPC :20012 / HTTP :21012(仅 /metrics)
# - Redis 强依赖(订单状态机 WATCH/MULTI/EXEC 乐观锁,存 Order proto bytes)
# - Kafka 弱依赖(生产 pandora.trade.audit,订单流转审计 / 对账)
# - dev: enable_reflection=true 便于 grpcurl 联调

server:
  grpc:
    network: tcp
    addr: ":20012"
    timeout: "15s"              # demo:弱网/本机抖动下 unary RPC 放宽;prod 再按接口收紧
    enable_reflection: true     # dev 开;prod 关(零值=false)
    max_conn_age: "15m"         # 达龄 GOAWAY 重拨,滚动更新时流量能滚到新副本(zero-downtime §6.2)
  http:
    network: tcp
    addr: ":21012"

node:
  node_id: 1
  redis_client:
    host: "127.0.0.1:6380"
    db: 0
    dial_timeout: "2s"
    read_timeout: "1s"
    write_timeout: "1s"

# kafka producer 配置(发布 pandora.trade.audit)
# brokers 9093 = Pandora 端口规划(与 vanilla 9092 区分)
kafka:
  brokers: ["127.0.0.1:9093"]
  dial_timeout: "2s"
  write_timeout: "5s"
  idempotent: true

trade:
  # order_ttl: 订单 Redis key 存活时长(应 > order_expire,留查询窗口)
  order_ttl: "10m"
  # order_expire: 订单从创建到自动过期(超时未完成两阶段确认 → 惰性置 EXPIRED)
  order_expire: "5m"
  # optimistic_retry: WATCH/MULTI/EXEC 冲突时最大重试次数
  optimistic_retry: 3
  # max_items_per_order: 单订单最大物品条目数
  max_items_per_order: 20
  # inventory_addr: inventory 服务 gRPC 直连地址。配上 → 结算走真实 inventory P2P 原子对转
  #   (GrpcResourceLedger);留空 + allow_noop_ledger=true 才退回 Noop。dev 接真实结算时取消注释:
  # inventory_addr: "127.0.0.1:20015"
  # allow_noop_ledger: 真实资源账本(inventory P2P 原子对转)接入前,显式允许 NoopResourceLedger 占位结算。
  #   dev 联调置 true(成交不真实扣转背包/货币);生产必须接真实账本(设 inventory_addr)并置 false,否则 main fail-fast。
  allow_noop_ledger: true

# 会话现行性门(R5 复审 P0-1,INC-20260722-004):校验客户端面请求 jti == login 会话权威
# (pandora:sess,node.redis_client 指向的共享 Redis)当前一代,顶号后旧 JWT 立即失效。
# dev 宽松档 require=false(gate 已装配时顶号/登出照常拒;仅漏配端点时跳过判定);
# -Prod 产物由 gen_cluster_config.ps1 机械置 true(漏配端点拒启)。
session_gate:
  require: false
