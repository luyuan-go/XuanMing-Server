# Pandora battle_result 服务开发期配置(W4 ③,2026-06-06)。
#
# - gRPC :20022 / HTTP :21022(仅 /metrics)
# - MySQL 强依赖(pandora_battle 库:battles + battle_player_stats,幂等落库 不变量 §2)
# - Kafka 强依赖(消费 pandora.battle.result / pandora.ds.lifecycle)
# - player.update 事务出箱发布(W4 ⑨ at-least-once 可靠补偿,不变量 §4;player 服务幂等 UpdateMMR)
# - W4 ④ player 服务已上线 → player_addr 指向 player gRPC,GrpcMMRReader 读真实当前 MMR
# - duration 字段用 pkg/config.Duration,yaml 可直接写 "3s"
# - dev: enable_reflection=true 便于 grpcurl 联调

server:
  grpc:
    network: tcp
    addr: ":20022"
    timeout: "15s"              # demo:弱网/本机抖动下 unary RPC 放宽;prod 再按接口收紧
    enable_reflection: true     # dev 开;prod 关(零值=false)
    max_conn_age: "15m"         # 达龄 GOAWAY 重拨,滚动更新时流量能滚到新副本(zero-downtime §6.2)
  http:
    network: tcp
    addr: ":21022"

node:
  node_id: 1
  # MySQL:dev 连本机 docker mysql 的 pandora_battle 库(强依赖,DSN 必填)。
  mysql_client:
    dsn: "pandora:pandora_dev_pwd@tcp(127.0.0.1:3307)/pandora_battle?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
    max_open_conns: 32
    max_idle_conns: 8
    conn_max_lifetime: "30m"
    ping_timeout: "3s"
  # Model-B DS callback authority 与其它 writer 共用 Redis 授权记录。
  # legacy/off 模式下保留此连接配置无副作用，切 authority_mode=redis 时则是强依赖。
  redis_client:
    host: "127.0.0.1:6380"
    db: 0
    dial_timeout: "2s"
    read_timeout: "1s"
    write_timeout: "1s"

kafka:
  brokers: ["127.0.0.1:9093"]
  group_id: "pandora-battle-result"
  partition_cnt: 4

# config_table: 策划配置表加载(不变量 §9.15;docs/design/config-table-hotreload.md)。
#   本服的 **dir 不可留空**:怪物击杀经验的唯一数值权威是 role_level 表
#   (源表 角色/j_角色等级.xlsx 的「击杀经验」列),缺表时每条击杀事实都会被
#   ReportProgress 按可重试错误退回,服务带病跑没有意义 —— 故启动即 fail-fast 退出。
#   dev 直接指仓库 dist(相对服务目录);部署环境用发布脚本落的 <deploy-root>/configtable/active。
#   热更走 ConfigTableAdminService.ReloadConfigTable,改完数值不必重启。
config_table:
  dir: "../../../configtable/dist"
battle:
  # elo_k_factor: Elo K 系数(胜负 MMR 变化幅度上限 ≈ K)
  elo_k_factor: 32
  # base_mmr: 玩家缺省 MMR(W4 ③ player 未上线 → StaticMMRReader 全返此值)
  base_mmr: 1500
  # consume_topics: 订阅 topic(留空走默认 [pandora.battle.result, pandora.ds.lifecycle])
  consume_topics:
    - "pandora.battle.result"
    - "pandora.ds.lifecycle"
  # authority_mode=redis 激活时必须删除 pandora.battle.result，只保留 ds.lifecycle；旧 topic
  # 不携带可核验 Model-B 凭据，服务会在连接 MySQL/Kafka 前启动失败，禁止绕过同步 ReportResult。
  # player_addr: player 服务 gRPC 地址(W4 ④ player 已上线 → 接真实当前 MMR;
  # 弱依赖:gRPC 懒连接,player 未起时调用失败由 biz 回退 base_mmr,不阻断落库)
  player_addr: "127.0.0.1:20002"
  # matchmaker_addr: matchmaker 服务 gRPC 地址。结算/废弃落库后调 matchmaker.ReleaseMatch
  # 释放残留撮合状态(player→ticket claim + 票据 + match 镜像),修复"结算返回 Hub 后
  # 玩家无法再次匹配(StartMatch 4002)"。弱依赖:懒连接,matchmaker 未起时仅 Warn 不阻断落库。
  matchmaker_addr: "127.0.0.1:20011"
  # Model-B 正常结算终态回收：ReportResult 鉴权快照与 battles/stats 同事务写
  # terminal_release_outbox；宽限 15s 给 DS 通知客户端，随后 worker 经 ds_allocator 做
  # Redis terminal/receipt CAS + UID precondition 回收。它不在同步响应路径杀 DS。
  # legacy/off 下不写 terminal outbox，本地址不会产生回收副作用。
  ds_allocator_addr: "127.0.0.1:20020"
  terminal_release_interval: "2s"
  terminal_release_batch_size: 128
  terminal_release_grace: "15s"
  # W4 ⑨ player.update 事务出箱发布器:落库同事务写出箱 → 后台轮询投递 Kafka(at-least-once 不变量 §4)
  outbox_publish_interval: "2s"
  outbox_batch_size: 128

  # ── 战斗中实时进度通道(实时成长,realtime-progression.md)────────────────────
  # progress_enabled: 通道开关(**缺省 false=关闭**,§14.2 默认不改变现有行为)。
  # dev 单副本本地集群无混版窗口,直接开启联调;生产启用纪律见 prod example
  # (battle_result 全 fleet 升级到含进度收口逻辑的版本后才能置 true,否则混版双发掉落)。
  # 关闭只拒新对局开流;已有水位的进行中对局继续收流到结算(每场模式固化)。
  progress_enabled: true
  # 怪物击杀经验**不在本文件配置**：数值权威是策划表 角色/j_角色等级.xlsx 的「击杀经验」列，
  # 经 configtable 的 role_level 表按 (角色ID, 等级) 查（见下方 config_table.dir）。
  # 2026-08-04 从本文件移除：游戏数值住在服务配置里，策划改不了、与同一只怪的血/攻分家、
  # ID 一致性也没有任何机制保证（实测漏配过 2007 蛇怪 / 2008 剧毒蛇怪且长期无人发现）。
  # 残留的 monster_exp 键会被严格解析直接拒绝启动，不会静默忽略。
  max_progress_batch: 256
  max_progress_seq_per_match: 100000
  max_kill_count_per_fact: 100
  max_pickup_count_per_fact: 10
  # 单场累计硬上限(事务权威侧封顶,失陷 DS 跨 seq 刷产出在此拦截;缺省 1000000 / 500)
  max_progress_exp_per_match: 1000000
  max_progress_items_per_match: 500
  # 单场单玩家累计硬上限(反作弊,realtime-progression.md:只按场累计时失陷 DS 仍可把
  # 全场额度灌给一人;缺省 200000 / 100 / 1000,击杀含未配置经验的怪)
  max_progress_exp_per_player: 200000
  max_progress_items_per_player: 100
  max_progress_kills_per_player: 1000
  # 进度出箱发布节奏(经验/掉落即时到账的体感上界;缺省 1s / 128)
  progress_publish_interval: "1s"
  progress_batch_size: 128
  # 掉落发放：过滤与路由直接读取同一 config_table 批次的 drop×item。
  # inventory_addr 未配 → 掉落出箱积压不丢。
  # 弱依赖:gRPC 懒连接,inventory 未起时出箱行保留重试,不阻断结算/进度落库。
  inventory_addr: "127.0.0.1:20015"
  # 可堆叠掉落走 GrantItems，装备走 GrantInstances；真实 dist 契约当前为 33/25。
  # 旧 drop_whitelist 字段仅保留单测/旧版本配置兼容，正式配置不得再手抄。

  # ── 战报保留期(§9.24 登记例外:180 天)──────────────────────────────────
  # 产品口径:MySQL 里最多只存最近六个月的战报,超过六个月的就没有数据
  # (2026-08-03 用户指令)。这条同时决定玩家能查到多久以前的战报(ListPlayerHistory
  # 只读 MySQL,没有冷存归档)。取值钳在 [30,180]。
  history_retention_days: 180
  # retention_mode: 本服留空即 delete(与其它域 report_only 默认相反,战报有产品寿命);
  # 这里显式写出来是为了让"这个库会真删数据"在配置里一眼可见。
  # 排查误删嫌疑时改成 report_only:只统计待清理量打 WARN,一行不删。
  retention_mode: "delete"
  # 清理节奏:每小时一轮,每轮每类小批量循环删到追平(单批 200 场,批间独立短事务不锁表)。
  retention_sweep_interval: "1h"
  retention_sweep_batch: 200

# ── DS 回调服务令牌校验(审核 P1 #1)────────────────────────────────────────────
# battle_result 只校验不签发:Battle DS 经 Envoy :8444 调 ReportResult 须带 battle 令牌
# (ds_allocator 分配时签发,绑 match_id,防拿 A 局令牌伪造 B 局结算)。
# mode: off(默认;UE DS 未带令牌前必须 off)→ permissive(灰度观察)→ enforce(强制)。
# secret 必须与 ds_allocator ds_auth.secret 一致。
ds_auth:
  mode: "off"
  authority_mode: "legacy"
  active_heartbeat_max_age: "30s"
  secret: "pandora-dev-jwt-secret-change-me-32!"
  # authority_mode=redis 时 fence 必填；dev/legacy 不连接 etcd。
  # fence:
  #   etcd_endpoints: ["127.0.0.1:2380"]
  #   etcd_prefix: "/pandora/ds-auth/"
  #   etcd_lease_ttl_sec: 15
  #   etcd_dial_timeout: "5s"
  #   keyset_revision: "pandora-ds-auth-v2-r1"
