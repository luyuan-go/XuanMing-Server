# Pandora player 服务开发期配置(W4 ④,2026-06-06)。
#
# - gRPC :20002 / HTTP :21002(仅 /metrics)
# - MySQL 强依赖(pandora_player 库:players + player_heroes + mmr_history,幂等 UpdateMMR 不变量 §2)
# - Kafka 强依赖(消费 pandora.player.update,battle_result 结算后发)
# - duration 字段用 pkg/config.Duration,yaml 可直接写 "3s"
# - dev: enable_reflection=true 便于 grpcurl 联调

server:
  grpc:
    network: tcp
    addr: ":20002"
    timeout: "15s"              # demo:弱网/本机抖动下 unary RPC 放宽;prod 再按接口收紧
    enable_reflection: true     # dev 开;prod 关(零值=false)
    max_conn_age: "15m"         # 达龄 GOAWAY 重拨,滚动更新时流量能滚到新副本(zero-downtime §6.2)
  http:
    network: tcp
    addr: ":21002"

node:
  node_id: 1
  # Redis:会话现行性门只读 login 会话权威 pandora:sess(R5 复审 P0-1,共享实例)。
  redis_client:
    host: "127.0.0.1:6380"
    db: 0
    dial_timeout: "2s"
  # MySQL:dev 连本机 docker mysql 的 pandora_player 库(强依赖,DSN 必填)。
  mysql_client:
    dsn: "pandora:pandora_dev_pwd@tcp(127.0.0.1:3307)/pandora_player?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
    max_open_conns: 32
    max_idle_conns: 8
    conn_max_lifetime: "30m"
    ping_timeout: "3s"

kafka:
  brokers: ["127.0.0.1:9093"]
  group_id: "pandora-player"
  partition_cnt: 4

# 玩家等级经验唯一读取源。宿主从仓库生成产物加载；集群配置生成器会改写为 Pod 挂载路径。
config_table:
  dir: "../../../configtable/dist"

player:
  # base_mmr: 新玩家缺省 MMR(与 battle_result base_mmr 对齐)
  base_mmr: 1500
  # mmr_floor: MMR 下限(UpdateMMR 后 clamp)
  mmr_floor: 0
  # default_nickname_prefix: 默认昵称前缀(EnsureProfile 建档 nickname=prefix+player_id)
  default_nickname_prefix: "Player_"
  # max_nickname_len: 昵称最大长度
  max_nickname_len: 32
  # hero_selection_enabled: 出战英雄选择开关(demo 阶段默认 false 跳过选英雄;联调养成时置 true)
  hero_selection_enabled: false
  # loadout_customize_enabled: 出战装备预设 / 天赋树自定义开关。
  # 2026-07-25 三项权威校验补齐后放开:
  #   - isEquip / slotMatch 读 config_table 道具表(零 RPC);
  #   - ownEquipment 经 inventory.CheckItemsOwned 系统 RPC(依赖下面的 inventory_addr);
  #   - SetTalents 读 config_table 专精表校验等级上限 / 前置 / 总消耗。
  # 任一依赖缺失(表未加载 / inventory_addr 未配)一律 fail-closed 拒绝,不会退化成放行。
  loadout_customize_enabled: true
  # inventory_addr: inventory 服务 gRPC 直连(内网无 JWT);SetEquipment 拥有权校验依赖它。
  # 留空 → SetEquipment 一律返回内部错误(不会静默跳过校验)。
  inventory_addr: "inventory:20015"
  # consume_topics: 订阅 topic(留空走默认 [pandora.player.update])
  consume_topics:
    - "pandora.player.update"

  # ── 玩家等级经验(实时成长,realtime-progression.md)──
  # 升级曲线不在 YAML 重复配置；唯一读取 config_table 的 player_level_exp 表。
  experience_enabled: true
  # max_exp_per_grant: 单次 AddExperience 入账上限(防异常调用方一次灌满;缺省 1000000)
  max_exp_per_grant: 1000000
  # push_outbox_interval / push_outbox_batch: 经验推送出箱发布节奏(缺省 1s / 128;
  # 满批自动连续排空,吞吐不受 interval 钉死)
  push_outbox_interval: "1s"
  push_outbox_batch: 128
  # retention_mode: 保留期清理总闸(§9.24)。**缺省 = report_only**:janitor 照常跑,
  # 每轮只统计超期行数并 WARN + pandora_db_retention_pending_rows,一行都不删。
  # 真删要这里写 "delete" **且**对应组的 *_cleanup_enabled 也为 true(两道闸)。
  # 拼错(如 "delet"/"true")启动即 fail-fast 拒启,绝不会被猜成 delete。
  # dev 写 delete 是为了覆盖真删代码路径(本地数据可弃);生产留空。
  retention_mode: "delete"
  # exp_history_cleanup_enabled: 经验收据**删除**前置条件确认(**缺省 false=只报告不删**:
  # progress 出箱无总重试期限,清收据会破坏幂等造成双发;上游具备小于留存期的有界重试后
  # 才可开启)。dev 本地联调开启以覆盖清理代码路径,无双发风险(本地数据可弃)。
  exp_history_cleanup_enabled: true
  # exp_history_retention: 经验幂等收据留存期(缺省 7d,下限 7d;report_only 与 delete 共用同一值)
  exp_history_retention: "168h"
  # history_cleanup_enabled: mmr_history / 点数授予 / 技能卡授予幂等历史**删除**前置条件确认
  # (缺省 false=只报告不删,§9.24;前置条件:上游 kafka retention / 授予补扫窗口 < 留存期)。
  # dev 开启覆盖清理代码路径。
  history_cleanup_enabled: true
  # history_retention_days: 上述四表留存天数(缺省 90,下限 30,上限 90;报告与实删共用同一值)
  history_retention_days: 90

# 会话现行性门(R5 复审 P0-1,INC-20260722-004):校验客户端面请求 jti == login 会话权威
# (pandora:sess,node.redis_client 指向的共享 Redis)当前一代,顶号后旧 JWT 立即失效。
# dev 宽松档 require=false(gate 已装配时顶号/登出照常拒;仅漏配端点时跳过判定);
# -Prod 产物由 gen_cluster_config.ps1 机械置 true(漏配端点拒启)。
session_gate:
  require: false
