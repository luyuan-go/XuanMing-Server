# Pandora mail 服务开发期配置(2026-06-29)。
#
# - gRPC :50009 / HTTP :51009(仅 /metrics)
# - MailService:系统/公会邮件拉取式(channel+watermark),个人邮件写扩散(离线可达)
# - MySQL 强依赖(pandora_social 库:sys_mail/guild_mail/player_mail/player_mail_cursor/player_mail_claim;读 guild_members 判玩家所属公会)
# - 不依赖 kafka(系统/公会拉取,个人落库即达)
# - dev: enable_reflection=true 便于 grpcurl 联调

server:
  grpc:
    network: tcp
    addr: ":50009"
    timeout: "15s"
    enable_reflection: true
    max_conn_age: "15m"         # 达龄 GOAWAY 重拨,滚动更新时流量能滚到新副本(zero-downtime §6.2)
  http:
    network: tcp
    addr: ":51009"

node:
  # node_id 必须与 inventory 不同(inventory=1,mail=2)。
  # 理由:instance_id 是**跨服务**铸造的 ID 空间 —— inventory 在 GrantInstances 里铸,
  # mail 在 buildClaimIntent 里也铸;两批实例可能汇进同一玩家的同一个背包段,
  # 而 snowflake 的唯一性只在「同 node_id 的同一个发号器内」成立。两服务都用 node_id: 1
  # 时发出的号逐位相同(pkg/snowflake/etcdnode.ProvideSnowflakeN 契约),汇合时会被
  # data/bag_apply.go 的 duplicate instance 检查 fail-closed 拒掉,玩家领不了那封邮件。
  # ⚠️ etcd 模式救不了它:etcd 的 nodeID 空间按服务名隔离、跨服务**刻意复用**,
  # 两服务必须显式共用同一个 etcd_service_name 才能互斥——集群产物已由
  # gen_cluster_config.ps1 的 $SnowflakeEtcdNamespaceOverride 落实(共用 "instance-id")。
  node_id: 2
  # Redis:会话现行性门只读 login 会话权威 pandora:sess(R5 复审 P0-1,共享实例)。
  redis_client:
    host: "127.0.0.1:6380"
    db: 0
    dial_timeout: "2s"
  mysql_client:
    dsn: "pandora:pandora_dev_pwd@tcp(127.0.0.1:3307)/pandora_social?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
    max_open_conns: 32
    max_idle_conns: 8
    conn_max_lifetime: "30m"
    ping_timeout: "3s"

mail:
  # 系统/公会邮件 end_ms 为 0 时的默认有效期天数
  default_sys_ttl_days: 7
  # 个人邮件 expire_ms 为 0 时的默认有效期天数(一切邮件生命有限,sweep 清理前提)
  default_personal_ttl_days: 30
  # 单玩家收件箱行数上限(§9 不变量 18;满时驱逐最旧已领邮件,仍满拒收 ERR_MAIL_BOX_FULL)
  max_inbox_size: 200
  # 过期清理:每 sweep_interval 一轮,每表单批 sweep_batch 行;过期后再留 expired_retention_days
  # 缓冲才物理删(带未领附件的先归档 player_mail_archive,归档保留 archive_retention_days);
  # 领取记录按雪花 mail_id 截断,保留 claim_retention_days(须大于一切邮件最长有效期)
  sweep_interval: "5m"
  sweep_batch: 500
  expired_retention_days: 7
  archive_retention_days: 90
  claim_retention_days: 180
  max_title_len: 64
  max_body_len: 2048
  max_attachments: 16
  # inventory 服务 gRPC 地址,领取附件入库;留空且 allow_noop_grant=true 时仅标记不发奖
  inventory_addr: "127.0.0.1:50015"
  allow_noop_grant: false

# 会话现行性门(R5 复审 P0-1,INC-20260722-004):校验客户端面请求 jti == login 会话权威
# (pandora:sess,node.redis_client 指向的共享 Redis)当前一代,顶号后旧 JWT 立即失效。
# dev 宽松档 require=false(gate 已装配时顶号/登出照常拒;仅漏配端点时跳过判定);
# -Prod 产物由 gen_cluster_config.ps1 机械置 true(漏配端点拒启)。
session_gate:
  require: false
