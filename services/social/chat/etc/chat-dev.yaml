# Pandora chat 服务开发期配置(2026-06-16)。
#
# - gRPC :20005 / HTTP :21005(仅 /metrics)
# - MySQL 强依赖(pandora_social 库:chat_private_messages,私聊离线历史)
# - Kafka 弱依赖(生产 pandora.chat.{world,team,private,guild,group} → push 推送)
# - team 弱依赖(队伍频道解析成员;addr 空则队伍频道降级)
# - guild 弱依赖(公会 / 群频道解析成员;addr 空则公会 / 群频道降级)
# - dev: enable_reflection=true 便于 grpcurl 联调

server:
  grpc:
    network: tcp
    addr: ":20005"
    timeout: "15s"              # demo:弱网/本机抖动下 unary RPC 放宽;prod 再按接口收紧
    enable_reflection: true     # dev 开;prod 关(零值=false)
    max_conn_age: "15m"         # 达龄 GOAWAY 重拨,滚动更新时流量能滚到新副本(zero-downtime §6.2)
  http:
    network: tcp
    addr: ":21005"

node:
  node_id: 1
  # Redis:会话现行性门只读 login 会话权威 pandora:sess(R5 复审 P0-1,共享实例)。
  redis_client:
    host: "127.0.0.1:6380"
    db: 0
    dial_timeout: "2s"
  # MySQL:dev 连本机 docker mysql 的 pandora_social 库(强依赖,DSN 必填)。
  mysql_client:
    dsn: "pandora:pandora_dev_pwd@tcp(127.0.0.1:3307)/pandora_social?parseTime=true&loc=UTC&charset=utf8mb4&collation=utf8mb4_0900_ai_ci"
    max_open_conns: 32
    max_idle_conns: 8
    conn_max_lifetime: "30m"
    ping_timeout: "3s"

kafka:
  brokers: ["127.0.0.1:9093"]
  group_id: "pandora-chat"
  partition_cnt: 4

chat:
  # max_content_len: 单条消息最大字符数(utf8 rune,默认 256)
  max_content_len: 256
  # history_limit: PullHistory 单次返回上限(默认 50)
  history_limit: 50
  # team_addr: team 服务 gRPC 地址;空 → 队伍频道降级(弱依赖)
  team_addr: "127.0.0.1:20010"
  # guild_addr: guild 服务 gRPC 地址(GuildService + GroupService 同进程);空 → 公会 / 群频道降级
  guild_addr: "127.0.0.1:20008"
  # sensitive_words: 敏感词列表(命中整词替换为等长 *);空 → 不过滤
  sensitive_words: []

# 会话现行性门(R5 复审 P0-1,INC-20260722-004):校验客户端面请求 jti == login 会话权威
# (pandora:sess,node.redis_client 指向的共享 Redis)当前一代,顶号后旧 JWT 立即失效。
# dev 宽松档 require=false(gate 已装配时顶号/登出照常拒;仅漏配端点时跳过判定);
# -Prod 产物由 gen_cluster_config.ps1 机械置 true(漏配端点拒启)。
session_gate:
  require: false
