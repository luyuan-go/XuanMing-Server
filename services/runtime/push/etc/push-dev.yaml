# Pandora push 服务开发期配置(W2 ⑤ → W3 ④ 2026-06-05 真实化)。
#
# - gRPC 端口 50014(server stream,客户端经 Envoy gRPC-Web 连过来)
# - HTTP 端口 51014(目前只暴露 /metrics;push 服务无 RESTful RPC)
# - W3 ④ 起接 kafka(订阅 push topic) + redis ZSET 离线消息缓存
# - W3 ⑥ 起 duration 字段用 pkg/config.Duration 包装,yaml 可直接写 "5s" / "5m"
# - W3 ③ 起 server.grpc.enable_reflection 可控,dev: true / prod: false(零值)

server:
  grpc:
    network: tcp
    addr: ":50014"
    enable_reflection: true     # dev:开 reflection 便于 grpcurl 联调
    max_conn_age: "15m"         # 达龄 GOAWAY 重拨,滚动更新时流量能滚到新副本(zero-downtime §6.2)
  http:
    network: tcp
    addr: ":51014"

node:
  node_id: 1
  session_expire_min: 1440
  redis_client:
    host: "127.0.0.1:6380"      # Pandora Redis 端口(deploy/docker-compose.dev.yml)
    db: 0
    dial_timeout: "2s"

# W3 ④ kafka 消费者配置(共享 pkg/config.KafkaConfig)。
# brokers 9093 = Pandora 端口规划(deploy/docker-compose.dev.yml,与 vanilla 9092 区分)。
kafka:
  brokers: ["127.0.0.1:9093"]
  group_id: "pandora-push"
  partition_cnt: 4
  dial_timeout: "2s"
  read_timeout: "10s"
  write_timeout: "10s"
  channel_buffer: 1024
  idempotent: true              # 防重复(配合幂等 producer)

push:
  # 订阅 topic 列表;不填走 kafkax.PushTopics 默认。
  # 2026-06-15 friend 服务上线,补 pandora.friend.event。
  # 2026-06-15 hub_allocator 强制整合上线,补 pandora.hub.migrate(大厅迁移通知)。
  # 2026-06-16 chat 三频道补全,补 pandora.chat.team(队伍)/ pandora.chat.world(世界广播)。
  #   chat.world 是广播类 topic(空 key),push 走 Broadcast(kafkax.IsBroadcastTopic)。
  # 2026-06-19 presence 订阅推送上线(§13.4),补 pandora.presence.update(key=subscriber_id)。
  # 2026-06-27 群聊上线,补 pandora.chat.guild(公会频道)/ pandora.chat.group(临时群频道,均 key=接收方)
  #   + pandora.guild.event(公会成员变更通知,key=to_player_id)。
  # 2026-07-21 实时成长上线,补 pandora.player.experience(经验/升级推送,key=player_id,
  #   event_type=1;独立 topic 原因见 pkg/kafkax/topics.go TopicPlayerUpdate 注释)。
  topics:
    - "pandora.team.update"
    - "pandora.match.progress"
    - "pandora.chat.private"
    - "pandora.chat.team"
    - "pandora.chat.world"
    - "pandora.chat.guild"
    - "pandora.chat.group"
    - "pandora.friend.event"
    - "pandora.guild.event"
    - "pandora.hub.migrate"
    - "pandora.presence.update"
    - "pandora.player.experience"

  # 离线消息 redis ZSET TTL(每次写入刷新)。
  offline_cache_ttl: "5m"

  # 会话现行性门强制档(P0,INC-20260722-004):true = 建流必须携带 Envoy 验签 jti 且为
  # login 会话权威(pandora:sess)当前一代,权威不可达 fail-closed 拒;流内 30s 复查
  # jti/exp(顶号/登出/过期关流)。dev 直连内网端口联调保持 false(有 jti 仍校验);
  # **生产由 gen_cluster_config -Prod 机械置 true**,不允许生产关闭。
  require_session_gate: false
