// Pandora MissionService 协议。
//
// 职责(docs/design/mission.md):通用任务域——接取 / 放弃 / 条件事实驱动进度 /
// 完成扇出(发奖或标记可领、自动接后续链)/ 领奖。语义移植自 luyuan/mmorpg C++
// mission/condition/reward 模块,存储与发放链按本仓标准件落地。
//
// 身份纪律:
//   - 客户端 RPC(ListMissions/AcceptMission/AbandonMission/ClaimMissionReward)
//     经 Envoy,player_id 一律以 JWT x-pandora-player-id 为准,请求体不携带;
//   - 系统 RPC(ReportMissionFacts/CompleteAllMissions)仅内网直连(callerID==0),
//     服务层 systemOnly 拒玩家 JWT,Envoy 精确 path direct_response 403 双保险,
//     不对客户端暴露。
//
// 推送:进度 / 完成 / 可领变化经 kafka `pandora.mission.update`(key=player_id)
// 由 push 服务透传,payload = MissionUpdateEvent。推送不承担正确性
// (protocol-ordering-rules 原则 5):客户端判重按 mission_config_id + 状态,
// 收到 pandora.push.resync 后必须回源 ListMissions 全量重拉。

syntax = "proto3";

package pandora.mission.v1;

import "pandora/common/v1/errcode.proto";

service MissionService {
  // ── 客户端 RPC(Envoy,JWT 身份)────────────────────────────────────────

  // 权威快照:活跃任务(含进度/目标)+ 已完成任务(含领奖状态)。
  // 全量返回:活跃侧被 max_active_missions 写入上限兜住,完成侧被任务表行数
  // 有界(§9.18 达标口径)。也是 push resync 的回源接口。
  rpc ListMissions(ListMissionsRequest) returns (ListMissionsResponse);

  // 接取任务。校验:配置存在 / 未接取 / 未完成 / (type, sub_type) 类型互斥 /
  // 活跃数上限。同步返回本任务初始快照。
  rpc AcceptMission(AcceptMissionRequest) returns (AcceptMissionResponse);

  // 放弃任务。已完成的任务不可放弃(ERR_MISSION_ALREADY_COMPLETED)。
  rpc AbandonMission(AbandonMissionRequest) returns (AbandonMissionResponse);

  // 领取任务奖励(reward_state=CLAIMABLE → CLAIMED,CAS)。
  // 领取受理即权威生效;奖励内容经 mission_reward_log 补扫链 at-least-once 必达
  // (下游 inventory/player 幂等键去重),本 RPC 不同步等待入包。
  rpc ClaimMissionReward(ClaimMissionRewardRequest) returns (ClaimMissionRewardResponse);

  // ── 系统 RPC(内网 callerID==0,不过 Envoy)─────────────────────────────

  // 条件事实上报:任务进度的唯一写入通道。at-least-once 语义,幂等键由调用方
  // 提供并稳定(如 battle_result 出箱行 progress:{match}:{seq}:{player}:mission);
  // 重复上报撞收据 uk 幂等返回 already=true,不重复入账。
  // 空 condition_ids 的事实不推进任何进度(继承 D 版护栏:全空槽条件匹配任意
  // 同类事件,无槽位值的事实若放行会误推此类条件)。
  rpc ReportMissionFacts(ReportMissionFactsRequest) returns (ReportMissionFactsResponse);

  // GM / 调试:把玩家当前全部活跃任务直接置为已完成并清空活跃列表。
  //
  // 刻意**不发奖、不标记可领、不自动接后续链、不触发 COMPLETE_MISSION 再入**——
  // 与正常完成路径(ReportMissionFacts 内的完成扇出)是两条不可合并的路径
  // (D 版 todo.md #225 教训)。
  //
  // **但仍然推送**(MissionUpdateEvent.completed):不推等于让客户端保留一份与权威
  // 不一致的活跃列表,直到玩家下次 ListMissions 才对齐 —— GM 改了状态却看不见,
  // 正是调试最需要避免的。推送不承担正确性(protocol-ordering-rules 原则 5),
  // 推它不会把两条路径合并,漏推却会制造一个"只有 GM 知道"的状态漂移。
  // (2026-08-11 更正:本注释此前写"不广播完成事件",与 biz.CompleteAll 的实现相反;
  //  经复核实现是对的,注释是错的。)
  rpc CompleteAllMissions(CompleteAllMissionsRequest) returns (CompleteAllMissionsResponse);
}

// 条件类别。1-8 继承 luyuan/mmorpg eConditionType 取值,9 起为本仓扩展。
// 配置表 condition.condition_category 与 MissionFact.condition_category 都取本枚举值。
enum MissionConditionCategory {
  MISSION_CONDITION_CATEGORY_UNSPECIFIED = 0;
  MISSION_CONDITION_CATEGORY_KILL_MONSTER       = 1;  // 杀怪;槽位1=monster_config_id
  MISSION_CONDITION_CATEGORY_TALK_NPC           = 2;  // 与 NPC 对话;槽位1=npc_id(事实源未接,预留)
  MISSION_CONDITION_CATEGORY_COMPLETE_CONDITION = 3;  // 完成指定条件;槽位1=condition_id
  MISSION_CONDITION_CATEGORY_USE_ITEM           = 4;  // 使用道具;槽位1=item_config_id
  MISSION_CONDITION_CATEGORY_INTERACT           = 5;  // 交互;槽位1=interact_id(事实源未接,预留)
  MISSION_CONDITION_CATEGORY_LEVEL_UP           = 6;  // 升级;槽位1=达到的等级(事实源未接,预留)
  MISSION_CONDITION_CATEGORY_CUSTOM             = 7;  // 自定义
  MISSION_CONDITION_CATEGORY_COMPLETE_MISSION   = 8;  // 完成任务;槽位1=mission_config_id(域内自产,完成扇出再入)
  MISSION_CONDITION_CATEGORY_PICKUP_ITEM        = 9;  // 拾取物品;槽位1=item_config_id(本仓扩展,D 版无)
}

// 已完成任务的领奖状态。NONE 兼作零值:无奖励配置或奖励已自动发放,均无需领取。
enum MissionRewardState {
  MISSION_REWARD_STATE_NONE      = 0;  // 无需领取(无奖励 / auto_reward 已走发放链)
  MISSION_REWARD_STATE_CLAIMABLE = 1;  // 可领取
  MISSION_REWARD_STATE_CLAIMED   = 2;  // 已领取(内容经补扫链必达)
}

// ── 客户端可见结构 ─────────────────────────────────────────────────────────

message ActiveMission {
  uint32 mission_config_id = 1;
  // 每条件槽当前进度,与任务表 condition_ids 等长同序,已按目标 clamp。
  repeated uint32 progress = 2;
  // 每条件槽目标值(服务端按表算好下发:任务行 target_counts>0 优先,否则条件行
  // target_count)。客户端只做展示,不得据此实现第二份判定。
  repeated uint32 targets = 3;
  uint64 accepted_at_ms = 4;
}

message CompletedMission {
  uint32 mission_config_id = 1;
  MissionRewardState reward_state = 2;
  uint64 completed_at_ms = 3;
}

// ── 客户端 RPC 出入参 ───────────────────────────────────────────────────────

message ListMissionsRequest {
  // 身份以 JWT x-pandora-player-id 为准,无请求字段。
}

message ListMissionsResponse {
  pandora.common.v1.ErrCode code = 1;
  repeated ActiveMission active = 2;
  repeated CompletedMission completed = 3;
}

message AcceptMissionRequest {
  uint32 mission_config_id = 1;
}

message AcceptMissionResponse {
  pandora.common.v1.ErrCode code = 1;
  ActiveMission mission = 2;
}

message AbandonMissionRequest {
  uint32 mission_config_id = 1;
}

message AbandonMissionResponse {
  pandora.common.v1.ErrCode code = 1;
}

message ClaimMissionRewardRequest {
  uint32 mission_config_id = 1;
}

message ClaimMissionRewardResponse {
  pandora.common.v1.ErrCode code = 1;
}

// ── 系统 RPC 出入参 ─────────────────────────────────────────────────────────

// 单条条件事实。与 CfgCondition 的匹配规则:类别相等,且条件行 slotN 非空时
// 事实 condition_ids[N-1] 必须命中该槽集合;全部非空槽命中才算匹配。
message MissionFact {
  MissionConditionCategory condition_category = 1;
  // 槽位值(语义随类别,见枚举注释)。空数组 = 不推进任何进度。
  repeated uint32 condition_ids = 2;
  // 进度增量(如杀怪数)。0 视为无效事实,跳过。
  uint32 amount = 3;
}

message ReportMissionFactsRequest {
  // 目标玩家(系统调用方指定;本 RPC 不经 Envoy,无 JWT 身份可用)。
  uint64 player_id = 1;
  repeated MissionFact facts = 2;
  // 调用方稳定幂等键(≤128 字节)。同键重复上报幂等吸收;同键不同内容按指纹
  // fail-closed 拒绝(ERR_MISSION_FACTS_CONFLICT)。
  string idempotency_key = 3;
}

message ReportMissionFactsResponse {
  pandora.common.v1.ErrCode code = 1;
  // 幂等命中:收据已存在,本次未入账(调用方视作成功,照常出队)。
  bool already = 2;
}

message CompleteAllMissionsRequest {
  uint64 player_id = 1;
}

message CompleteAllMissionsResponse {
  pandora.common.v1.ErrCode code = 1;
  // 本次被置为完成的任务数。
  uint32 completed_count = 2;
}

// ── 推送 payload(客户端可见,kafka pandora.mission.update)──────────────────

message MissionUpdateEvent {
  // 进度有变化的活跃任务(逐任务全量快照,非增量)。
  repeated ActiveMission progressed = 1;
  // 本批完成的任务(含领奖状态)。
  repeated CompletedMission completed = 2;
  // 完成扇出自动接取的后续任务。
  repeated ActiveMission auto_accepted = 3;
  uint64 ts_ms = 4;
}

// ── 服务端存储快照(StorageRecord,不外露给客户端)────────────────────────────

// player_mission_active.progress 列(VARBINARY(256),写入过 dbguard.CheckPayload)。
message MissionProgressStorageRecord {
  repeated uint32 progress = 1;
}

message MissionRewardItem {
  uint32 item_config_id = 1;
  uint32 count = 2;
  // 发放形态**冻结位**:落快照那一刻该道具是不是装备(equip_slot>0)。
  //
  // 为什么必须冻结而不是发放时回读道具表:装备走 GrantInstances(键 `<key>:inst`)、
  // 堆叠走 GrantItems(键 `<key>:stack`),**两个键在 inventory 台账里互不相识**。
  // 形态一旦在两次投递之间变化(配置热更改了 equip_slot,或滚动升级期新旧副本加载着
  // 不同配置批次),同一条奖励就会先后用两个不同幂等键各发一次 —— 幂等键防不住,
  // 因为它们压根不是同一个键。冻结后补扫重放永远走当初那条路由,与配置无关。
  //
  // optional(显式 presence):**缺省 = 本字段上线前写的旧行**,发放侧回退到读道具表
  // (保持旧行为,§9.17 双向兼容);新行一律带值。不要把"没记"和"记了 false"混为一谈。
  optional bool equipment = 3;
}

// mission_reward_log.reward_pb 列(VARBINARY(2048)):发放内容快照,补扫重放的
// 唯一权威入参(发放时不回读配置表,配置热更不影响在途发放)。
message MissionRewardStorageRecord {
  repeated MissionRewardItem items = 1;
  uint64 exp = 2;
}
