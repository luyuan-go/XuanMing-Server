// Pandora 配置表:技能方位类型——圆形。
//
// 源表:Pandora-Client-SVN/Table/技能/j_技能_方位类型_圆形.xlsx(策划维护,SVN)。
// 产物:XuanMing-Server/configtable/dist/skill_circle.json(tools/configtable-gen 生成,git 跟踪)。
// 加载:服务端 pkg/configtable 以 protojson 读入本容器,全批校验通过后原子切换。
//
// 用途:技能在「方位指示器」模式下的圆形表现规格(客户端 CfgSkillCircle / FCfgSkillCircle 同源导出)。
//   按客户端 CfgSkillCircle.h 注释,本表**仅用于技能选择目标为方位模式时的表现形态,
//   与技能应用时的判定逻辑无关**——即纯表现数据。服务端自身不据本表做任何数值或准入判定,
//   登记它的理由与 particle / weapon 表一致:两端共用同一张 xlsx,未登记的表头列会被
//   configtable-gen 判为非法,登记后「改列只改 xlsx 表头 + 本文件注解」两处。
//
// 版式(实测):第 1 行列名(A..D),第 2-3 行是「位置选项」取值说明(1:固定在自身 / 2:跟随鼠标指针),
//   第 4-6 行为整行空(仅有样式,无值),数据自**第 7 行**起至第 17 行共 11 行。
//   显式写 (excel_data_start_row) = 7 是把实测版式钉进 proto:通用默认值 5 当前碰巧也能导出
//   同样结果(第 5-6 行整行空会被 allEmpty 跳过),但那是巧合——策划一旦在第 5 / 6 行补一句
//   说明,该行就会被当成数据行、因主键列为空报「主键须为正整数」而整批生成失败。
//
// 契约:字段名 = 生成 JSON key(protojson UseProtoNames,snake_case);
//   列名映射 / 默认值 / 前缀约束全部由 excel.proto 注解承载(proto 即单一事实源)。
//   必填 / 默认值刻意与客户端列登记(Tool/Table/Cs/Proto/j_技能_方位类型_圆形.json)逐列一致,
//   避免同一张 xlsx 在两仓被解释成两种数据。
// 规范:配置表 ID 默认 uint32(CLAUDE.md §5.6);流水线契约见 docs/design/config-table-hotreload.md。

syntax = "proto3";

package pandora.config.v1;

import "pandora/config/v1/excel.proto";

// SkillCircleRow 技能圆形方位表一行(列序 = 字段号序 = 表头 A..D)。
message SkillCircleRow {
  // ID(主键,方位规格 ID;由技能表按 ID 引用)。实测 11 行互不重复:
  //   1 / 2 / 4 / 5 / 6 / 8 是通用规格,100211 / 100311 / 100321 / 100331 / 100421 是按
  //   「角色技能」编制的专用规格,故不可从 ID 反推分段规则。
  uint32 id = 1 [(excel_col) = "ID", (excel_required) = true];
  // 备注(策划可读说明,如「4米半径圆形」「控场辅助Dekker技能1」)。纯注释列,客户端未登记本列。
  string remark = 2 [(excel_col) = "备注"];
  // 位置选项(圆心跟随方式)。源表第 2-3 行注明取值 1=固定在自身、2=跟随鼠标指针;
  //   客户端 EMySkillOrientPosOption 另有 0=无。实测 11 行全为 2。
  // 刻意**不造 enum**:0(无)是合法取值,而 configtable-gen 的 parseCell 把枚举列的 0
  //   判为非法值(CLAUDE.md §5.12 / weapon.weapon_type 同理),用无符号整型承载即可。
  // 空单元格取 1(= 固定在自身),与客户端列登记 defaultValue="1" 对齐。
  uint32 pos_option = 3 [(excel_col) = "位置选项", (excel_default) = "1"];
  // 圆形集合(可叠加的多个同心圆表现规格)。文本格式:多组以 ';' 分隔,组内以 ',' 分隔为
  //   「Niagara 资产路径,半径(厘米)」,实例:
  //   "/Game/Fx/SkillRangeLocator/NS_Decal_CycleRange_02.NS_Decal_CycleRange_02,400"。
  //   客户端解析成 TArray<FMySkillCircleFxSpec>{Fx, Radius}(csp=';' / ksp=',')。
  // 刻意**不标 (excel_prefix) = "/"**:本列是复合值而非纯资产路径(同 weapon.model_info),
  //   前缀约束会把「留空 = 不显示圆形指示器」这类合法写法卡死;路径合法性由 UE 侧加载时暴露。
  // 刻意**不标 required**:客户端列登记 defaultValue="" 允许留空,服务端标 required 会让
  //   同一张表在两仓一边能导一边导不出(整批生成失败)。实测 11 行当前均已填。
  string circles = 4 [(excel_col) = "圆形集合"];
}

// SkillCircleTableData 技能圆形方位整表容器(dist/skill_circle.json 的根对象;excel_file 注解 = 导表登记)。
message SkillCircleTableData {
  option (excel_file) = "技能/j_技能_方位类型_圆形.xlsx";
  option (excel_data_start_row) = 7;

  repeated SkillCircleRow rows = 1;
}
