// Pandora 配置表:角色数值属性映射表。
//
// 源表:Pandora-Client-SVN/Table/角色/j_角色数值属性映射.xlsx(策划维护,SVN)。
// 产物:XuanMing-Server/configtable/dist/role_attr_map.json(tools/configtable-gen 生成,git 跟踪)。
// 加载:服务端 pkg/configtable 以 protojson 读入本容器,全批校验通过后原子切换。
// 用途:属性代码名 → 界面显示名的项目口径字典(Hp→血量、Atk→攻击力、Shield→护盾、
//   MoveSpeedRate→移动速度倍率)。直接消费者是客户端角色面板
//   (MyRoleAttrView / MyRoleInfoView 按 CodeName 查 ShowName,同源导出 FCfgAttrMap);
//   服务端登记本表同 role.proto —— 两端共用同一张 xlsx,未登记的表头列会被判为非法。
//
// 版式:**本表没有策划注释行**,第 1 行列名、第 2 行即数据,故显式 (excel_data_start_row) = 2
//   (Pandora 通用版式是第 5 行起,这里必须覆盖,否则前两条 Hp / Atk 会被当成注释吃掉)。
//   实测判据:客户端导出产物 Tool/Table/Cs/Temp/CfgAttrMap.json 恰为 4 行 id=1/3/5/7,
//   与 xlsx 的 R2/R3/R5/R7 一一对应 —— R4、R6 是整行空行,导表器按「整行全空跳过」处理,
//   所以 ID 不连续(1,3,5,7)是源表原样,不是漏读。
// 规范:配置表 ID 默认 uint32(CLAUDE.md §5.6)。

syntax = "proto3";

package pandora.config.v1;

import "pandora/config/v1/excel.proto";

// RoleAttrMapRow 角色数值属性映射表一行(列序 = 字段号序 = 表头 A..C)。
message RoleAttrMapRow {
  // ID(主键;当前取值 1/3/5/7,源表中段留有空行,编号刻意不连续)
  uint32 id = 1 [(excel_col) = "ID", (excel_required) = true];
  // 代码名(属性英文缩写键,与客户端英文缩写规范一致,如 Hp / Atk / Shield / MoveSpeedRate)
  string code_name = 2 [(excel_col) = "代码名", (excel_required) = true];
  // 显示名(界面展示中文名,如 血量 / 攻击力 / 护盾 / 移动速度倍率)
  string show_name = 3 [(excel_col) = "显示名", (excel_required) = true];
}

// RoleAttrMapTableData 角色数值属性映射整表容器
// (dist/role_attr_map.json 的根对象;注册名 role_attr_map)。
message RoleAttrMapTableData {
  option (excel_file) = "角色/j_角色数值属性映射.xlsx";
  // 无注释行,第 2 行即数据(实测,见文件头)。
  option (excel_data_start_row) = 2;

  repeated RoleAttrMapRow rows = 1;
}
