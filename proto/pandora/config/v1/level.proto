// Pandora 配置表:关卡表。
//
// 源表:Pandora-Client-SVN/Table/关卡/g_关卡.xlsx(策划维护,SVN)。
// 产物:XuanMing-Server/configtable/dist/level.json(tools/configtable-gen 生成,git 跟踪)。
// 加载:服务端 pkg/configtable 以 protojson 读入本容器,全批校验通过后原子切换。
// 契约:字段名 = 生成 JSON key(protojson UseProtoNames,snake_case);
//   列名映射 / 必填 / 默认值 / 前缀约束全部由 excel.proto 注解承载(proto 即单一事实源),
//   改列只改「xlsx 表头 + 本文件注解」两处,生成器与服务端代码自动跟随。
// 规范:配置表 ID 默认 uint32(CLAUDE.md §5.6);流水线契约见 docs/design/config-table-hotreload.md。

syntax = "proto3";

package pandora.config.v1;

import "pandora/config/v1/excel.proto";

// LevelEntryMode 入口模式:这张图「怎么进」。
// 从 matchmaker 部署级开关 walk_in 下沉为关卡表数据(CLAUDE.md §17.1「差异进表」):
// 部署级开关表达不了「同一个池里,有的副本直进、有的副本要撮合」——而这正是
// 「多人撮合进副本」需要的。撮合池归属仍由 game_mode 列决定,与本列正交。
enum LevelEntryMode {
  // 未配置:沿用该 matchmaker 部署的 walk_in 开关(旧批次表 + 新二进制的兼容路径,§9.21)。
  LEVEL_ENTRY_MODE_UNSPECIFIED = 0;
  // 撮合:入池按 MMR 窗口凑齐 side_count×team_size 人后装箱分方,再进确认期。
  LEVEL_ENTRY_MODE_MATCHMAKE   = 1;
  // 直进(walk-in):单张票据(单人或整队)立即成局,跳过撮合与确认,不与陌生人凑对手。
  LEVEL_ENTRY_MODE_WALK_IN     = 2;
}

// LevelExpShareMode 击杀经验归属方式:这张图里「怪物经验判给谁」。
// 消费者是战斗 DS(怪物死亡时按本列决定给哪些玩家上报 MonsterKillFact 及其 share_permille);
// 经验数值换算仍只在 battle_result 的 monster_exp 表,DS 只报事实不报数值(CLAUDE.md §9.6)。
enum LevelExpShareMode {
  // 未配置:按最后一击处理(= 本列上线前的既定行为,滚动混版下新旧表都安全)。
  LEVEL_EXP_SHARE_MODE_UNSPECIFIED  = 0;
  // 最后一击:整份经验只给打出致命一击的玩家(share_permille=1000,单条事实)。
  LEVEL_EXP_SHARE_MODE_LAST_HIT     = 1;
  // 全队共享:本场在册且对该怪造成过伤害的玩家每人各拿一整份,不按伤害稀释
  //   (share_permille 恒 1000,每人一条事实)。
  LEVEL_EXP_SHARE_MODE_TEAM_SHARE   = 2;
  // 伤害占比均分:一整份经验按各玩家对该怪的伤害占比切分(share_permille 合计 ≤1000)。
  //   ⚠️ 放量前必须先升 battle_result 全 fleet,理由见 battle/v1 MonsterKillFact.share_permille。
  LEVEL_EXP_SHARE_MODE_DAMAGE_SPLIT = 3;
}

// LevelCategory 关卡类别(对齐 g_关卡.xlsx「关卡类别」列取值,JSON 里用数字)。
enum LevelCategory {
  LEVEL_CATEGORY_UNSPECIFIED = 0;
  LEVEL_CATEGORY_LOGIN       = 1; // 登录
  LEVEL_CATEGORY_ROLE_SELECT = 2; // 选角
  LEVEL_CATEGORY_MAIN_CITY   = 3; // 主城
  LEVEL_CATEGORY_BATTLE      = 4; // 战斗 / 副本(可被匹配 / 进本的玩法关卡)
}

// LevelRow 关卡表一行(列序 = 字段号序 = 表头 A..G)。
message LevelRow {
  // ID(主键,即全链路 map_id)
  uint32 id = 1 [(excel_col) = "ID", (excel_required) = true];
  // 关卡名称(策划可读名)
  string name = 2 [(excel_col) = "关卡名称", (excel_required) = true];
  // 关卡资源(UE 关卡资产路径)
  string asset_path = 3 [(excel_col) = "关卡资源", (excel_required) = true, (excel_prefix) = "/"];
  // GameMode类(UE 类路径,空 = 关卡默认)
  string game_mode_class = 4 [(excel_col) = "GameMode类", (excel_prefix) = "/"];
  // 关卡类别(枚举数字;0=UNSPECIFIED 不允许)
  LevelCategory category = 5 [(excel_col) = "关卡类别", (excel_required) = true];
  // 禁止ui快捷键开关(源表空值默认 1=禁止,表头注释「1:禁止(默认)」)
  bool disable_ui_shortcut = 6 [(excel_col) = "禁止ui快捷键开关", (excel_default) = "1"];
  // 匹配列表显示(源表空值默认 0=不显示)
  bool show_in_match_list = 7 [(excel_col) = "匹配列表显示", (excel_default) = "0"];
  // 队伍人数(一方人数;matchmaker 按 map_id 撮合 team_size vs team_size,
  //   本地端到端 1v1 填 1,正式 5v5 填 5;源表空值默认 0=沿用服务端全局 team_size 兜底,
  //   仅战斗类关卡有意义,非副本行留空)
  uint32 team_size = 8 [(excel_col) = "队伍人数", (excel_default) = "0"];
  // 是否能退出(客户端退出按钮门控:1=允许主动退出并按失败结算返回 Hub,0=不显示退出按钮;
  //   当前仅单人 PVE 副本置 1,DS 端 RequestSoloDungeonLeave 仍对 PVE/单人 roster 做兜底校验)
  bool allow_exit = 9 [(excel_col) = "是否能退出", (excel_default) = "0"];
  // 玩法模式(canonical game_mode):取值必须与承接该关卡的 matchmaker 部署 game_mode 完全一致
  //   ("5v5_ranked"=默认撮合部署,"pve_coop"=walk_in 直进部署)。非战斗类关卡留空。
  // 用途一(客户端):按 map_id 查得本列 → 选路由与冷启动恢复校验。**这是「这张图属于哪个撮合池」
  //   的唯一事实源**;客户端不得再按 game_mode_class 字符串推断玩法,也不得硬编码模式白名单
  //   (CLAUDE.md §17.1;退役 MyTeamModel.cpp IsPveMatchMap 与 PandoraMatchClient.cpp 双串白名单)。
  // 用途二(服务端):matchmaker 交叉校验本列与自身部署 game_mode,不符即拒——既挡住伪造路由头,
  //   也把"PVE 图被丢进 PVP 池空排队"变成一次明确失败。
  // 战斗类关卡留空 = 配置缺失,两端均 fail-closed 拒绝进入(不猜默认池)。
  string game_mode = 10 [(excel_col) = "玩法模式", (excel_default) = ""];
  // 入口模式(枚举数字;空单元格=未配置,沿用部署级 walk_in 开关)。见 LevelEntryMode。
  // 刻意**不写 (excel_default)**:枚举列的 0 被生成器视为非法数据值(与 category 同规则),
  // 而本列的"未配置"恰恰要落 0。空单元格在无默认值时直接保持类型零值、不进枚举校验,
  // 正好表达该语义;非战斗类关卡(登录/选角/主城)本就不经 StartMatch,留空即可。
  LevelEntryMode entry_mode = 11 [(excel_col) = "入口模式"];
  // 对局方数(几方对抗):PVE 合作副本填 1,PVP 对抗填 2,多队混战填 N。
  //   0 = 未配置,沿用服务端默认 2(与历史 need=2×team_size 逐字节等价)。
  // 撮合凑齐人数 = side_count × team_size;直进(walk-in)不看本列。
  uint32 side_count = 12 [(excel_col) = "对局方数", (excel_default) = "0"];
  // 经验归属方式(枚举数字;空单元格=未配置,按最后一击处理)。见 LevelExpShareMode。
  // 与 entry_mode 同规则**刻意不写 (excel_default)**:枚举列的 0 被生成器视为非法数据值,
  //   而本列的"未配置"恰恰要落 0;非战斗类关卡(登录/选角/主城)没有怪物,留空即可。
  // 本列由战斗 DS 读取(客户端 FCfgLevel 同源导出);服务端登记本列是因为两端共用同一张
  //   g_关卡.xlsx —— 未登记的表头列会被 configtable-gen 判为非法。服务端自身暂不按本列
  //   判定归属(归属只影响"给谁产事实",数值权威与全部上限仍在 battle_result)。
  LevelExpShareMode exp_share_mode = 13 [(excel_col) = "经验归属方式"];
  // 对局时长(秒):本图一局最多打多久,到点由战斗 DS 权威结算收局。
  //   0 = 未配置 → **不限时**,与本列上线前逐字节等价(滚动混版下新旧表都安全)。
  // 消费者是战斗 DS(客户端 FCfgLevel 同源导出,只用来显示倒计时)。服务端登记本列同 exp_share_mode
  //   的理由:两端共用同一张 g_关卡.xlsx,未登记的表头列会被 configtable-gen 判为非法。
  //   服务端自身不据此判定任何东西——"这一局到点了没"只有 DS 知道,后端仍按既有 battle_result
  //   / 心跳超时路径处理,不引入第二个计时权威。
  uint32 battle_duration_seconds = 14 [(excel_col) = "对局时长", (excel_default) = "0"];
}

// LevelTableData 关卡表整表容器(dist/level.json 的根对象;excel_file 注解 = 导表登记)。
message LevelTableData {
  option (excel_file) = "关卡/g_关卡.xlsx";
  // 关卡 ID 位序映射:供关卡解锁 / 通关进度位图存储用(旧项目 mission/reward 同款机制)。
  option (excel_bit_index) = true;

  repeated LevelRow rows = 1;
}
