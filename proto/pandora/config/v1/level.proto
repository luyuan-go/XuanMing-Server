// Pandora 配置表:关卡表。
//
// 源表:Pandora-Client-SVN/Table/关卡/g_关卡.xlsx(策划维护,SVN)。
// 产物:XuanMing-Server/configtable/dist/level.json(tools/configtable-gen 生成,git 跟踪)。
// 加载:服务端 pkg/configtable 以 protojson 读入本容器,全批校验通过后原子切换。
// 契约:字段名 = 生成 JSON key(protojson UseProtoNames,snake_case);
//   列名映射 / 必填 / 默认值 / 前缀约束全部由 excel.proto 注解承载(proto 即单一事实源),
//   改列只改「xlsx 表头 + 本文件注解」两处,生成器与服务端代码自动跟随。
// 规范:配置表 ID 默认 uint32(CLAUDE.md §5.6);流水线契约见 docs/design/config-table-hotreload.md。

syntax = "proto3";

package pandora.config.v1;

import "pandora/config/v1/excel.proto";

// LevelEntryMode 入口模式:这张图「怎么进」。
// 从 matchmaker 部署级开关 walk_in 下沉为关卡表数据(CLAUDE.md §17.1「差异进表」):
// 部署级开关表达不了「同一个池里,有的副本直进、有的副本要撮合」——而这正是
// 「多人撮合进副本」需要的。撮合池归属仍由 game_mode 列决定,与本列正交。
//
// 本枚举有两种用法,语义不同,别混:
//   ① 关卡表 LevelRow.entry_mode —— 这张图**允许哪些进法**(BOTH = 两种都开放);
//   ② StartMatchRequest.entry_mode —— 玩家**这一次选哪种进法**(§17.2 客户端只传选择)。
// 服务端按 ① fail-closed 校验 ②:选择不在允许集合内即拒,表填 BOTH 而请求没明确选择也拒
// (不猜默认入口——猜错的后果是玩家以为在排队实则已经单刷,或反之)。
enum LevelEntryMode {
  // 未配置:沿用该 matchmaker 部署的 walk_in 开关(旧批次表 + 新二进制的兼容路径,§9.21)。
  // 用在请求上时表示「玩家没选」:仅当该图只允许一种进法时才按那一种放行。
  LEVEL_ENTRY_MODE_UNSPECIFIED = 0;
  // 撮合:入池按 MMR 窗口凑齐 side_count×team_size 人后装箱分方,再进确认期。
  LEVEL_ENTRY_MODE_MATCHMAKE   = 1;
  // 直进(walk-in):单张票据(单人或整队)立即成局,跳过撮合与确认,不与陌生人凑对手。
  LEVEL_ENTRY_MODE_WALK_IN     = 2;
  // 两种都开放(只用于关卡表列,不用于请求):PVE 副本的目标形态——排队撮合凑满 team_size,
  // 或人凑不够时玩家自己选择直进(直进受 min_team_size 下限约束)。
  // 「等不及了」由玩家点直进表达,服务端不做「等 N 秒自动降人数」的猜测(§15.3)。
  LEVEL_ENTRY_MODE_BOTH        = 3;
}

// LevelExpShareMode 击杀经验归属方式:这张图里「怪物经验判给谁」。
// 消费者是战斗 DS(怪物死亡时按本列决定给哪些玩家上报 MonsterKillFact 及其 share_permille);
// 经验数值换算仍只在 battle_result 的 monster_exp 表,DS 只报事实不报数值(CLAUDE.md §9.6)。
enum LevelExpShareMode {
  // 未配置:按最后一击处理(= 本列上线前的既定行为,滚动混版下新旧表都安全)。
  LEVEL_EXP_SHARE_MODE_UNSPECIFIED  = 0;
  // 最后一击:整份经验只给打出致命一击的玩家(share_permille=1000,单条事实)。
  LEVEL_EXP_SHARE_MODE_LAST_HIT     = 1;
  // 全队共享:本场在册且对该怪造成过伤害的玩家每人各拿一整份,不按伤害稀释
  //   (share_permille 恒 1000,每人一条事实)。
  LEVEL_EXP_SHARE_MODE_TEAM_SHARE   = 2;
  // 伤害占比均分:一整份经验按各玩家对该怪的伤害占比切分(share_permille 合计 ≤1000)。
  //   ⚠️ 放量前必须先升 battle_result 全 fleet,理由见 battle/v1 MonsterKillFact.share_permille。
  LEVEL_EXP_SHARE_MODE_DAMAGE_SPLIT = 3;
}

// LevelRatingMode 计分模式:这张图打完「算不算段位分(MMR / Elo)」。
// 消费者是 battle_result 的结算路径。判定值在**成局时**由 matchmaker 读本列定格进
// canonical BattleStorageRecord,结算只认定格值、不在结算那一刻重新查表——否则热更改本列
// 会改写「正在打的那一局」的计分规则(与 game_mode / map_id 同为本局元数据,同一口径定格)。
enum LevelRatingMode {
  // 未配置:沿用本列上线前的既定口径(canonical game_mode=="pve_coop" 不计分,其余按 Elo)。
  // 滚动混版下旧批次表与旧 BattleStorageRecord 都安全(§9.21);新表应显式填值。
  LEVEL_RATING_MODE_UNSPECIFIED = 0;
  // 不计分:本图结算一律 mmr_delta=0,且完全不读 MMR(PVE 副本 / 娱乐图 / 训练场)。
  LEVEL_RATING_MODE_NONE        = 1;
  // 按 Elo 计分:battle_result 用既有 Elo 换算写 mmr_delta(排位对抗图)。
  //
  // ⚠️ **本档目前只指向唯一一份全局段位,不区分玩法**(2026-08-11 查证):
  // `players.mmr` 是单列全局值,`MMRReader.GetMMR(ctx, player_id)` /
  // `PlayerService.UpdateMMR(player_id, delta, reason, idem_key)` / `mmr_history` /
  // `PlayerUpdateEvent.mmr_delta` 全链路**没有任何玩法维度**。
  // 因此「3v3 与 5v5 各算各的段位」这类需求**当前实现不支持**:填了本档的图无论人数
  // 多少都在改同一份分。要做到分开算,缺的是**段位分区键 + 分区存储**(方案与拍板点见
  // PROGRESS.md 2026-08-11「段位分区缺口」条),不是再加一个枚举值。
  // 在那之前,不要以为填了本列就已经按玩法分开计分了。
  LEVEL_RATING_MODE_ELO         = 2;
}

// LevelCategory 关卡类别(对齐 g_关卡.xlsx「关卡类别」列取值,JSON 里用数字)。
enum LevelCategory {
  LEVEL_CATEGORY_UNSPECIFIED = 0;
  LEVEL_CATEGORY_LOGIN       = 1; // 登录
  LEVEL_CATEGORY_ROLE_SELECT = 2; // 选角
  LEVEL_CATEGORY_MAIN_CITY   = 3; // 主城
  LEVEL_CATEGORY_BATTLE      = 4; // 战斗 / 副本(可被匹配 / 进本的玩法关卡)
}

// LevelRow 关卡表一行(列序 = 字段号序 = 表头 A..G)。
message LevelRow {
  // ID(主键,即全链路 map_id)
  uint32 id = 1 [(excel_col) = "ID", (excel_required) = true];
  // 关卡名称(策划可读名)
  string name = 2 [(excel_col) = "关卡名称", (excel_required) = true];
  // 关卡资源(UE 关卡资产路径)
  string asset_path = 3 [(excel_col) = "关卡资源", (excel_required) = true, (excel_prefix) = "/"];
  // GameMode类(UE 类路径,空 = 关卡默认)
  string game_mode_class = 4 [(excel_col) = "GameMode类", (excel_prefix) = "/"];
  // 关卡类别(枚举数字;0=UNSPECIFIED 不允许)
  LevelCategory category = 5 [(excel_col) = "关卡类别", (excel_required) = true];
  // 禁止ui快捷键开关(源表空值默认 1=禁止,表头注释「1:禁止(默认)」)
  bool disable_ui_shortcut = 6 [(excel_col) = "禁止ui快捷键开关", (excel_default) = "1"];
  // 匹配列表显示(源表空值默认 0=不显示)
  bool show_in_match_list = 7 [(excel_col) = "匹配列表显示", (excel_default) = "0"];
  // 队伍人数(一方人数**上限**,也是撮合的凑齐目标;matchmaker 按 map_id 撮合
  //   team_size vs team_size,本地端到端 1v1 填 1,正式 5v5 填 5;源表空值默认
  //   0=沿用服务端全局 team_size 兜底,仅战斗类关卡有意义,非副本行留空)
  // 两条入口对本列的用法不同:撮合按 side_count×team_size **凑满**才成局;
  //   直进只把它当**上限**(超编队伍拒绝入场),实到几人就带几人进。
  uint32 team_size = 8 [(excel_col) = "队伍人数", (excel_default) = "0"];
  // 是否能退出(客户端退出按钮门控:1=允许主动退出并按失败结算返回 Hub,0=不显示退出按钮;
  //   当前仅单人 PVE 副本置 1,DS 端 RequestSoloDungeonLeave 仍对 PVE/单人 roster 做兜底校验)
  bool allow_exit = 9 [(excel_col) = "是否能退出", (excel_default) = "0"];
  // 玩法模式(canonical game_mode):**撮合池 / 部署标识**,取值必须与承接该关卡的 matchmaker
  //   部署 game_mode 完全一致("5v5_ranked"=默认撮合部署,"pve_coop"=walk_in 直进部署)。
  //   非战斗类关卡留空。
  // ⚠️ 本列**只表达「这张图归哪个池」**,不表达人数、方数、是否排位:
  //   人数 / 方数看 team_size × side_count(存量值 "5v5_ranked" 的图现在 team_size 是 1 和 3,
  //   名字里的 5 对任何一行都不成立,是历史遗留标签);算不算段位看 rating_mode。
  //   **禁止按本列的字符串去解析人数或推断计分**——那是第二份判定(§9.22),
  //   历史上已因此出过 fail-open(见 rating_mode 注释)。新增池名不要再带数字。
  // 用途一(客户端):按 map_id 查得本列 → 选路由与冷启动恢复校验。**这是「这张图属于哪个撮合池」
  //   的唯一事实源**;客户端不得再按 game_mode_class 字符串推断玩法,也不得硬编码模式白名单
  //   (CLAUDE.md §17.1;退役 MyTeamModel.cpp IsPveMatchMap 与 PandoraMatchClient.cpp 双串白名单)。
  // 用途二(服务端):matchmaker 交叉校验本列与自身部署 game_mode,不符即拒——既挡住伪造路由头,
  //   也把"PVE 图被丢进 PVP 池空排队"变成一次明确失败。
  // 战斗类关卡留空 = 配置缺失,两端均 fail-closed 拒绝进入(不猜默认池)。
  string game_mode = 10 [(excel_col) = "玩法模式", (excel_default) = ""];
  // 入口模式(枚举数字;空单元格=未配置,沿用部署级 walk_in 开关)。见 LevelEntryMode。
  // 刻意**不写 (excel_default)**:枚举列的 0 被生成器视为非法数据值(与 category 同规则),
  // 而本列的"未配置"恰恰要落 0。空单元格在无默认值时直接保持类型零值、不进枚举校验,
  // 正好表达该语义;非战斗类关卡(登录/选角/主城)本就不经 StartMatch,留空即可。
  LevelEntryMode entry_mode = 11 [(excel_col) = "入口模式"];
  // 对局方数(几方对抗):PVE 合作副本填 1,PVP 对抗填 2,多队混战填 N。
  //   0 = 未配置,沿用服务端默认 2(与历史 need=2×team_size 逐字节等价)。
  // 撮合凑齐人数 = side_count × team_size;直进(walk-in)不看本列。
  uint32 side_count = 12 [(excel_col) = "对局方数", (excel_default) = "0"];
  // 经验归属方式(枚举数字;空单元格=未配置,按最后一击处理)。见 LevelExpShareMode。
  // 与 entry_mode 同规则**刻意不写 (excel_default)**:枚举列的 0 被生成器视为非法数据值,
  //   而本列的"未配置"恰恰要落 0;非战斗类关卡(登录/选角/主城)没有怪物,留空即可。
  // 本列由战斗 DS 读取(客户端 FCfgLevel 同源导出);服务端登记本列是因为两端共用同一张
  //   g_关卡.xlsx —— 未登记的表头列会被 configtable-gen 判为非法。服务端自身暂不按本列
  //   判定归属(归属只影响"给谁产事实",数值权威与全部上限仍在 battle_result)。
  LevelExpShareMode exp_share_mode = 13 [(excel_col) = "经验归属方式"];
  // 对局时长(秒):本图一局最多打多久,到点由战斗 DS 权威结算收局。
  //   0 = 未配置 → **不限时**,与本列上线前逐字节等价(滚动混版下新旧表都安全)。
  // 消费者是战斗 DS(客户端 FCfgLevel 同源导出,只用来显示倒计时)。服务端登记本列同 exp_share_mode
  //   的理由:两端共用同一张 g_关卡.xlsx,未登记的表头列会被 configtable-gen 判为非法。
  //   服务端自身不据此判定任何东西——"这一局到点了没"只有 DS 知道,后端仍按既有 battle_result
  //   / 心跳超时路径处理,不引入第二个计时权威。
  uint32 battle_duration_seconds = 14 [(excel_col) = "对局时长", (excel_default) = "0"];
  // 队伍人数下限(**只对直进入口生效**):人没凑够时玩家自己进,至少要这么多人才准进。
  //   0 = 未配置 → 无下限(1 人也能直进),与本列上线前逐字节等价(滚动混版下新旧表都安全)。
  // 刻意**不对撮合入口生效**:撮合的目标恒是凑满 team_size,凑不够就继续等——「等不及」
  //   是玩家改点直进来表达的,不是服务端替他降人数(§15.3 拒绝预设性复杂化)。
  // 校验(加载期,pkg/configtable/level.go):填了本列就必须同时填 team_size,且
  //   min_team_size ≤ team_size ≤ MaxLevelTeamSize;下限比上限还大的行整表拒绝。
  // ⚠️ 只在**进场那一刻**判定,不是局内持续不变量:开局后有人退出 / 掉线导致人数掉到
  //   下限以下,绝不允许据此踢人或强制收局(§9.19 / §9.20 不得让玩家卡死或被踢出场景)。
  uint32 min_team_size = 15 [(excel_col) = "队伍人数下限", (excel_default) = "0"];
  // 计分模式(枚举数字;空单元格=未配置,沿用旧口径)。见 LevelRatingMode。
  // 与 entry_mode / exp_share_mode 同规则**刻意不写 (excel_default)**:枚举列的 0 被生成器视为
  //   非法数据值,而本列的"未配置"恰恰要落 0;非战斗类关卡本就不结算,留空即可。
  //
  // 本列存在的理由(2026-08-11):在它之前,「算不算段位」是从 canonical game_mode 字符串用
  //   **排除法**推出来的(battle_result:`!= "pve_coop"` 即算 Elo)。而 game_mode 是撮合池 /
  //   部署标识,是会新增取值的——ds/v1 `AllocateBattleRequest.game_mode` 的注释里就已经写着
  //   未来取值 "casual_5v5" / "custom"。任何新池在旧口径下都会**静默按排位改玩家段位**,
  //   而改段位不可逆,是最坏的失败方向。计分与否从此是表里一条独立事实:
  //   新增玩法只填这一列,不改代码(§17.1 差异进表)。
  LevelRatingMode rating_mode = 16 [(excel_col) = "计分模式"];
  // 段位池(rating_pool):本图算**哪一份**段位分。`rating_mode=ELO` 时必填,其余情况必须留空。
  //
  // 与 game_mode 正交,这是本列存在的全部理由(2026-08-11 用户拍板「3v3 与 5v5 不共用同一份
  //   段位」):game_mode 回答「这张图去哪个**撮合池**」,本列回答「打完算进哪一份**段位**」。
  //   两者维度不同——撮合隔离早已由 matchmaker 按 map_id 分组解决(`partitionTicketsByMap`,
  //   3v3 图与 1v1 图本就不会串局),所以**不需要**为「段位分开」新建一整套 matchmaker 部署 /
  //   audience / Redis 命名空间(§15.2 最少复杂度)。让一个字符串同时扛「撮合池」和「段位池」
  //   正是上一轮 fail-open 的成因,不再重犯。
  //
  // 取值是自由标识符(如 "5v5_ranked" / "3v3_ranked"),**语义只有"同值即同一份段位"**:
  //   服务端不解析其内容、不从中推断人数或玩法,只当分区键用(`player_mmr` 主键的一半)。
  //   两张图想共用一份段位就填同一个值;想各算各的就填不同值。新增一份段位 = 填一个新值,
  //   玩家在该值下从基线分起步,**不污染任何既有段位**(这与"用池名排除法推布尔"有本质区别:
  //   前者是分区,漏配的后果是新开一份分;后者是推导,漏配的后果是静默改错既有分)。
  //
  // 校验(加载期,pkg/configtable/level.go):ELO 必须填、非 ELO 必须留空,两向都拒——
  //   「要计分却没说算哪份」会让结算无处落账;「不计分却填了池」是配置误解,早报早改。
  string rating_pool = 17 [(excel_col) = "段位池", (excel_default) = ""];
  // 准备时长(秒):本图开局后留给玩家「都进得来、都站定」的**最长等待**,到点或 roster 到齐
  //   (先到者)即开打。战斗时限从准备阶段结束才起算,准备期不吃玩家的对局时间。
  //   0 = 未配置 → **无准备阶段,立即开打**,与本列上线前逐字节等价(滚动混版下新旧表都安全)。
  // 语义**刻意不是「固定等待」**:配大了不会让先到的人干等满——人齐就开;配小了也不会把
  //   慢的人甩下——那是"最长等待"的上界,不是承诺。所以这个数按**本图最坏加载耗时**配即可
  //   (大图 / 流送重的图配大),不必权衡"等太久 vs 等不够"。
  // 消费者是战斗 DS(客户端 FCfgLevel 同源导出,只用来显示准备倒计时)。服务端登记本列同
  //   exp_share_mode / battle_duration_seconds 的理由:两端共用同一张 g_关卡.xlsx,
  //   未登记的表头列会被 configtable-gen 判为非法。服务端自身不据此判定任何东西——
  //   "准备阶段开没开完"只有 DS 知道,不引入第二个计时权威(§9.22)。
  uint32 prepare_duration_seconds = 18 [(excel_col) = "准备时长", (excel_default) = "0"];
  // 结算时长(秒):终局裁决之后、玩家被放回大厅之前的**展示窗口**(看战报 / 捡东西 / 走撤离)。
  //   0 = 未配置 → **无结算阶段**,终局握手一完成就通知客户端回 Hub,与本列上线前逐字节等价。
  // ⚠️ 它**不是**"结算数据要算多久"——结算事实的可靠投递(ReportResult → receipt → terminal ACK)
  //   与本窗口**并行**跑,互不等待。玩家实际退场时刻 = max(投递握手完成, 本窗口到点):
  //   投递快时玩家看满窗口;投递慢时玩家等投递(这正是本列上线前的既有行为,故不构成回归)。
  // 消费者同上,只有战斗 DS。
  uint32 settle_duration_seconds = 19 [(excel_col) = "结算时长", (excel_default) = "0"];
}

// LevelTableData 关卡表整表容器(dist/level.json 的根对象;excel_file 注解 = 导表登记)。
message LevelTableData {
  option (excel_file) = "关卡/g_关卡.xlsx";
  // 关卡 ID 位序映射:供关卡解锁 / 通关进度位图存储用(旧项目 mission/reward 同款机制)。
  option (excel_bit_index) = true;

  repeated LevelRow rows = 1;
}
